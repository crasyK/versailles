<!-- Paste into desktop/index.html. Unique data-id="now-playing". Requires data-hooks="media". -->
<style>
  .now { height: 138px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .media-row { display: flex; gap: 12px; align-items: center; }
  .art { width: 72px; height: 72px; border-radius: 14px; flex: none; background: var(--chip); border: var(--stroke); overflow: hidden; }
  .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .art img:not([src]) { display: none; }
  .media-controls { display: flex; gap: 8px; align-items: center; flex: none; }
  .media-controls button { background: none; color: var(--ink); padding: 2px; }
  .media-controls svg { width: 18px; height: 18px; display: block; }
  .media-controls .play svg { width: 26px; height: 26px; }
  .media-meta { min-width: 0; flex: 1; }
  .media-title { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .media-artist { font-size: 12px; color: var(--ink-mut); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .media-bottom { display: flex; align-items: center; gap: 8px; }
  .media-progress { flex: 1; min-width: 0; height: 4px; border-radius: 99px; background: var(--chip); overflow: hidden; }
  .media-progress i { display: block; height: 100%; width: 0%; background: #141414; }
  .media-times { flex: none; font-size: 10.5px; color: var(--ink-mut); font-variant-numeric: tabular-nums; }
  .now.idle .media-title { color: var(--ink-mut); }
  button:disabled { opacity: .35; cursor: default; }
</style>
<article class="widget now idle" data-id="now-playing" data-hooks="media" id="np-shell">
  <div class="media-row">
    <div class="art"><img id="np-art" alt="" /></div>
    <div class="media-controls" id="np-controls" data-no-drag>
      <button type="button" id="np-prev" aria-label="Previous" data-no-drag>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9.5 12z"/></svg>
      </button>
      <button type="button" class="play" id="np-toggle" aria-label="Play/Pause" data-no-drag>
        <svg viewBox="0 0 24 24" fill="currentColor" id="np-toggle-icon"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button type="button" id="np-next" aria-label="Next" data-no-drag>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l10.5-7z"/></svg>
      </button>
    </div>
    <div class="media-meta">
      <div class="media-title" id="np-title">Nothing playing</div>
      <div class="media-artist" id="np-artist">Play something to get started</div>
    </div>
  </div>
  <div class="media-bottom">
    <span class="media-times" id="np-time-cur">--:--</span>
    <div class="media-progress"><i id="np-progress"></i></div>
    <span class="media-times" id="np-time-dur">--:--</span>
  </div>
</article>
<script>
  (function nowPlaying() {
    const shell = document.getElementById('np-shell');
    if (!shell) return;
    const titleEl = document.getElementById('np-title');
    const artistEl = document.getElementById('np-artist');
    const art = document.getElementById('np-art');
    const progress = document.getElementById('np-progress');
    const timeCur = document.getElementById('np-time-cur');
    const timeDur = document.getElementById('np-time-dur');
    const prevBtn = document.getElementById('np-prev');
    const toggleBtn = document.getElementById('np-toggle');
    const toggleIcon = document.getElementById('np-toggle-icon');
    const nextBtn = document.getElementById('np-next');
    const ICON_PLAY = '<path d="M8 5v14l11-7z"/>';
    const ICON_PAUSE = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
    function media() {
      return (window.versailles && window.versailles.for) ? window.versailles.for('now-playing').media : null;
    }
    function isIdle(info) { return !info || info.host === false || info.hasSession === false || info.status === 'no-session'; }
    function fmtMs(ms) {
      if (!(ms > 0)) return '--:--';
      const s = Math.floor(ms / 1000);
      return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    }
    function render(info) {
      if (!info || isIdle(info)) {
        shell.classList.add('idle');
        titleEl.textContent = 'Nothing playing';
        artistEl.textContent = info && info.host === false ? 'Host required for media' : 'Play something to get started';
        art.removeAttribute('src');
        progress.style.width = '0%';
        toggleIcon.innerHTML = ICON_PLAY;
        prevBtn.disabled = toggleBtn.disabled = nextBtn.disabled = true;
        return;
      }
      shell.classList.remove('idle');
      titleEl.textContent = info.title || 'Untitled';
      artistEl.textContent = [info.artist, info.album].filter(Boolean).join(' · ') || 'Playing';
      if (info.thumbnailDataUrl) art.src = info.thumbnailDataUrl;
      progress.style.width = (info.durationMs > 0 ? Math.min(100, (info.positionMs / info.durationMs) * 100) : 0) + '%';
      timeCur.textContent = fmtMs(info.positionMs);
      timeDur.textContent = fmtMs(info.durationMs);
      toggleIcon.innerHTML = info.status === 'paused' ? ICON_PLAY : ICON_PAUSE;
      prevBtn.disabled = toggleBtn.disabled = nextBtn.disabled = false;
    }
    async function refresh() {
      try {
        const api = media();
        if (api) render(await api.now());
        else {
          const res = await fetch('/media/now', { headers: { Accept: 'application/json' } });
          render(await res.json());
        }
      } catch (err) { console.warn('media refresh', err); }
    }
    function bind(btn, fn) {
      btn.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); fn(); });
    }
    bind(prevBtn, function () { const api = media(); return api ? api.previous() : fetch('/media/previous', { method: 'POST' }); });
    bind(nextBtn, function () { const api = media(); return api ? api.next() : fetch('/media/next', { method: 'POST' }); });
    bind(toggleBtn, function () { const api = media(); return api ? api.playPause() : fetch('/media/play-pause', { method: 'POST' }); });
    (function wait(n) {
      if (window.versailles || n <= 0) { void refresh(); setInterval(refresh, 800); }
      else setTimeout(function () { wait(n - 1); }, 50);
    })(20);
  })();
</script>
