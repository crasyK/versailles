    <!-- ── e2e test pieces, injected by scripts/e2e.mjs ── -->
    <article class="widget" data-id="e2e-wall" data-hooks="storage,battery,network,focus,audio,bus,spawn,radios,audio-control,display,power-mode,wifi,bluetooth,dnd,tray,posture"
             style="position:fixed;left:8px;top:8px;font:12px monospace">e2e</article>
    <script>
      /* Reports what the wallpaper sees into its storage ("report"). */
      (function e2eWall() {
        if (/[?&]m=spawn/.test(location.search)) return;
        if (window.__e2eWall) return;
        window.__e2eWall = true;
        var report = { sdk: null, sensors: {}, pushes: {}, bus: [], persisted: null, errors: {}, controlRefused: null, tray: null, trayClick: null };
        (function wait(n) {
          var v = window.versailles;
          if (!v || typeof v.for !== 'function') { if (n < 400) setTimeout(function () { wait(n + 1); }, 50); return; }
          var me = v.for('e2e-wall');
          function save() { me.storage.set('report', report).catch(function () {}); }
          function err(key) { return function (e) { report.errors[key] = String((e && e.message) || e); save(); }; }
          report.sdk = v.version || 'unknown';
          me.storage.get('persist').then(function (p) {
            report.persisted = p == null ? 0 : p;
            return me.storage.set('persist', report.persisted + 1);
          }).then(save, err('storage'));
          ['battery', 'network', 'focus', 'audio', 'radios', 'audio-control', 'display', 'power-mode', 'wifi', 'bluetooth', 'dnd', 'posture'].forEach(function (h) {
            var api = me[{ 'audio-control': 'audioControl', 'power-mode': 'powerMode' }[h] || h];
            api.now().then(function (x) { report.sensors[h] = x == null ? 'null' : 'ok'; save(); }, err(h));
            me.on(h, function () { report.pushes[h] = (report.pushes[h] || 0) + 1; }).catch(err(h + '.on'));
          });
          // Tray icons: held only while this Versailles hides the taskbar.
          me.tray.track(function (icons, active) {
            report.tray = { active: active, icons: icons.length, apps: icons.map(function (t) { return t.app; }) };
            save();
          }).catch(err('tray'));
          v.invoke('tray_click', { id: 0, caller: 'e2e-wall' }).then(
            function () { report.trayClick = 'allowed'; save(); },
            function (e) { report.trayClick = String((e && e.message) || e); save(); });
          // Settings never change from the wallpaper, whatever it declares.
          v.invoke('quick_set', { action: { kind: 'mute', on: false }, caller: 'e2e-wall' }).then(
            function () { report.controlRefused = 'allowed'; save(); },
            function (e) { report.controlRefused = String((e && e.message) || e); save(); });
          me.bus.subscribe('e2e-hello', function (d, m) { report.bus.push(m.from); save(); }).then(function () {
            setTimeout(function () { me.spawn('e2e-overlay').catch(err('spawn')); }, 1500);
          }, err('bus'));
        })(0);
      })();
    </script>
    <template class="spawnable" data-id="e2e-overlay" data-anchor="c" data-dim="none" data-dismiss-on-blur="false"
              data-hooks="storage,bus,audio,audio-control,notify-control" data-w="200" data-h="80">
      <div style="font:12px monospace;padding:8px">e2e overlay</div>
      <script>
        /* Counts its own runs (template scripts must run once) and says hello on the bus. */
        window.__e2eRuns = (window.__e2eRuns || 0) + 1;
        (function wait(n) {
          var v = window.versailles;
          if (!v || typeof v.for !== 'function') { if (n < 400) setTimeout(function () { wait(n + 1); }, 50); return; }
          if (window.__e2eOverlay) return;
          window.__e2eOverlay = true;
          var me = v.for('e2e-overlay');
          setTimeout(function () {
            // A spawn window may change a setting: set mute to what it already is.
            me.audio.now().then(function (a) {
              return v.invoke('quick_set', { action: { kind: 'mute', on: !!a.muted }, caller: 'e2e-overlay' });
            }).then(function () { return 'ok'; }, function (e) { return String((e && e.message) || e); })
              .then(function (quickSet) { me.storage.set('quick', quickSet).catch(function () {}); });
            // Dismissing a notification that does not exist is refused with a reason.
            v.invoke('quick_set', { action: { kind: 'notifyDismiss', id: 0 }, caller: 'e2e-overlay' })
              .then(function () { return 'allowed'; }, function (e) { return String((e && e.message) || e); })
              .then(function (r) { me.storage.set('dismiss', r).catch(function () {}); });
            me.storage.set('report', { runs: window.__e2eRuns }).catch(function () {});
            me.bus.publish('e2e-hello', {}).catch(function () {});
          }, 500);
        })(0);
      </script>
    </template>
    <template class="spawnable" data-id="e2e-bar" data-anchor="bottom" data-h="24" data-hooks="storage">
      <div style="font:12px monospace;padding:4px 8px">E2E BAR</div>
      <script>
        /* Counts its page loads: a page edit must reload it, not hide it. */
        (function wait(n) {
          var v = window.versailles;
          if (!v || typeof v.for !== 'function') { if (n < 400) setTimeout(function () { wait(n + 1); }, 50); return; }
          if (window.__e2eBar) return;
          window.__e2eBar = true;
          var me = v.for('e2e-bar');
          me.storage.get('loads').then(function (n) { return me.storage.set('loads', (n || 0) + 1); }).catch(function () {});
        })(0);
      </script>
    </template>
    <template class="spawnable" data-id="e2e-key" data-anchor="tl" data-dim="none" data-dismiss-on-blur="false"
              data-hooks="hotkey,storage" data-hotkey="Win+F24" data-w="160" data-h="40">

          v.for('e2e-key').storage.set('opened', true).catch(function () {});
        })(0);
      </script>
    </template>
    <template class="spawnable" data-id="e2e-copilot" data-anchor="tr" data-dim="none" data-dismiss-on-blur="false"
              data-hooks="hotkey,storage" data-hotkey="Ctrl+Copilot" data-w="160" data-h="40">
      <div style="font:12px monospace;padding:8px">e2e copilot</div>
      <script>

          v.for('e2e-copilot').storage.set('opened', true).catch(function () {});
        })(0);
      </script>
    </template>
