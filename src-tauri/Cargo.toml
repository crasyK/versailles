[package]
name = "versailles"
version = "0.12.1"
description = "Versailles — lightweight HTML desktop widget host"
authors = ["you"]
edition = "2021"

[lib]
name = "versailles_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
# In-app updates (updater.rs). ~2.12: 2.13+ needs tauri 2.12. No rustls
# (reqwest's native-tls, as above) and no zip (NSIS installers only).
tauri-plugin-updater = { version = "~2.12", default-features = false, features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
notify = "7"
dirs = "6"
schemars = "0.8"
url = "2"
sysinfo = "0.30"
portable-pty = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
# Diagnostics bundle (diagnostics.rs): deflate only, through flate2 with its
# pure-Rust miniz_oxide backend (zip leaves the backend choice to us).
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# The starter desktop, embedded for the first-run offer (first_run.rs).
include_dir = "0.7"

[target.'cfg(windows)'.dependencies]
# `#[interface]` for undocumented COM interfaces (quick.rs); same version as `windows`.
windows-core = "0.61"
# WinRT collection arguments (wireless.rs); same version as `windows` uses.
windows-collections = "0.2"
windows = { version = "0.61", features = [
  "Foundation",
  "Devices_Geolocation",
  "Media_Control",
  "Storage_Streams",
  "Graphics_Imaging",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Accessibility",
  "Win32_System_LibraryLoader",
  "Win32_System_Wmi",
  "Win32_System_Rpc",
  "Win32_Devices_Display",
  "Devices_Radios",
  "Devices_Enumeration",
  "Win32_NetworkManagement_WiFi",
  "Win32_NetworkManagement_Ndis",
  "Win32_Media_KernelStreaming",
  "Foundation_Collections",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  # Jump lists (jumplist.rs): IObjectArray, item id lists.
  "Win32_UI_Shell_Common",
  "Win32_UI_HiDpi",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Power",
  # presence.rs (lock / unlock notifications).
  "Win32_System_RemoteDesktop",
  "Win32_System_Shutdown",
  "Networking_Connectivity",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Devices_FunctionDiscovery",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Search",
  "ApplicationModel",
  "UI_Notifications",
  "UI_Notifications_Management",
  # vpn.rs (RAS; RasGetConnectStatusW / RASENTRYW need WinSock types),
  # hotspot.rs.
  "Win32_NetworkManagement_Rras",
  "Win32_Networking_WinSock",
  "Networking_NetworkOperators",
] }

[profile.release]
# Keep abort: locks are `.lock().unwrap()` everywhere, so unwinding would cascade
# poisoned mutexes. Recovery is a clean restart (see src/crash.rs).
panic = "abort"
codegen-units = 1
lto = true

# Test installers (`npm run build:test`): no LTO, parallel codegen and
# incremental builds. A rebuild after a code change takes ~40 s and peaks at
# ~1.4 GB (thin LTO took 9-17 min and peaked above 5 GB); the first build
# after a clean checkout ~12 min. Slightly larger and slower binary; never
# ship it. Releases keep [profile.release].
[profile.release-test]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

# Debug ACL context overflows Tauri's default 8MiB thread on Windows.
[patch.crates-io]
tauri-codegen = { path = "vendor/tauri-codegen" }
