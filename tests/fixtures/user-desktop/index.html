    <!--
      Single-file desktop dialect
      .widget              static tile on the canvas
      .spawnable           template; host opens a native always-on-top window
      .action-bar          optional example class on a spawnable
      data-id              catalog id (calc aliases calculator)
      data-w / data-h      overlay size
      data-anchor          c/center/overlay = mid-screen overlay; tc = top-center; tr = docked slide-out
      data-hotkey          global accelerator when data-hooks includes hotkey
                           (any spawnable; Alt+Space, Ctrl+Shift+D, CommandOrControl+K)
      data-hooks           allowlist: media, mouse, layout, spawn, shell, hotkey, pty

      Preview: ?m=desktop (default) | widgets | spawn | spawn&id=draw | action_bar
    -->
    <style>
      :root {
        --font-sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", Roboto, sans-serif;
        --font-mono: "Cascadia Mono", "JetBrains Mono", Consolas, monospace;
        --bg: #0e0e10;
        --canvas: #0e0e10;
        --paper: #1a1b1f;
        --ink: #ececef;
        --ink-mut: #9aa0a8;
        --muted: #9aa0a8;
        --chip: #2b2d33;
        --white: #22242a;
        --dark-card: #131212;
        --accent: #ececef;
        --accent-ink: #141414;
        --stroke: 2px solid #000000;
        --stroke-dashed: 2px dashed #43464e;
        --shadow: 0 4px 0 0 #000000;
        --radius-pill: 32px;
        --radius-card: 20px;
        --radius-chip: 9999px;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; }
      body {
        display: flex;
        flex-direction: column;
        font-family: var(--font-sans);
        color: var(--ink);
        background-color: var(--bg);
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        background-size: 28px 28px;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      html.overlay, html.overlay body {
        width: 100% !important;
        height: 100% !important;
        background: transparent;
        background-image: none;
        overflow: hidden;
      }
      html.overlay:has(.cli), html.overlay:has(.cli) body {
        background: var(--paper);
      }
      /* Transparent WebView2 + <canvas> crashes the GPU process on Windows. */
      html.overlay:has(.draw-pad), html.overlay:has(.draw-pad) body {
        background: var(--paper);
      }
      html.overlay #preview-root,
      html.overlay body.preview #preview-root {
        display: flex !important;
        flex-direction: column;
        width: 100%;
        height: 100%;
        padding: 0;
        overflow: hidden;
      }
      html.overlay .spawn-surface.solo {
        flex: 1;
        min-width: 0;
        min-height: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      html.overlay .spawn-surface.solo > .cli {
        flex: 1;
        min-height: 0;
        width: 100%;
        height: 100%;
      }
      button { font-family: inherit; border: 0; cursor: pointer; background: none; color: inherit; }

      .stage {
        position: relative;
        flex: 1;
        min-height: 0;
        padding: 26px;
        display: grid;
        grid-template-columns: 360px minmax(280px, 1fr) 400px;
        grid-template-rows: auto 1fr;
        gap: 14px;
      }
      article.widget {
        background: var(--paper);
        border: var(--stroke);
        box-shadow: var(--shadow);
        border-radius: var(--radius-card);
        min-width: 0;
        min-height: 0;
      }
      .quote { grid-column: 1; grid-row: 1; height: 152px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
      .quote .q-head { display: flex; align-items: center; gap: 10px; }
      .quote .q-badge {
        flex: none; width: 26px; height: 26px; border-radius: 9px; padding-top: 8px;
        background: var(--ink); color: var(--accent-ink); box-shadow: 0 2px 0 0 #000000;
        display: grid; place-items: center; font: 700 20px/1 var(--font-sans);
      }
      .quote .q-label { font: 600 11px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-mut); }
      .quote .text { font: 500 15px/1.45 var(--font-sans); letter-spacing: -0.01em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
      .quote .q-foot { margin-top: auto; display: flex; align-items: center; gap: 10px; min-height: 0; }
      .quote .q-rule { flex: none; width: 22px; height: 2px; background: var(--ink); border-radius: 2px; }
      .quote .who { font: 600 11px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-mut); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      .top-right {
        grid-column: 3;
        grid-row: 1;
        display: flex;
        align-items: flex-start;
        justify-content: flex-end;
        gap: 12px;
        min-height: 0;
      }
      .weather { flex: none; width: 174px; height: 168px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
      .wx-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 28px; }
      .wx-place { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: text; flex: 1; }
      .wx-loc {
        display: none; flex: 1; min-width: 0; height: 28px;
        border: var(--stroke-dashed); background: var(--white); color: var(--ink);
        border-radius: var(--radius-chip); padding: 0 10px;
        font: 600 11px/1 var(--font-sans); letter-spacing: 0.04em; text-transform: uppercase; outline: none;
      }
      .weather.is-editing .wx-place, .weather.is-error .wx-place { display: none; }
      .weather.is-editing .wx-loc, .weather.is-error .wx-loc { display: block; }
      .wx-loc:focus { border-style: solid; }
      .wx-glyph { flex: none; width: 28px; height: 28px; }
      .wx-glyph svg { display: block; width: 100%; height: 100%; }
      .wx-temp { font: 600 52px var(--font-sans); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1; }
      .wx-meta { font-size: 12px; line-height: 1.3; color: var(--ink-mut); }
      .weather.is-error .wx-temp { color: var(--ink-mut); }
      .weather.is-error .wx-glyph { visibility: hidden; }

      .watch { flex: none; width: 248px; height: 248px; padding: 0; border-radius: 50%; position: relative; display: grid; place-items: center; }
      .chrono-dial { width: 176px; aspect-ratio: 1; cursor: pointer; border-radius: 50%; outline: none; }
      .chrono-dial:focus-visible { box-shadow: 0 0 0 2px var(--ink); }
      .chrono-dial .dial { width: 100%; aspect-ratio: 1; display: block; }
      .arc-track { fill: none; stroke: var(--chip); stroke-width: 4; opacity: 0; }
      .arc-elapsed { fill: none; stroke: #e5484d; stroke-width: 8; stroke-linecap: round; opacity: 0; }
      .chrono-btn {
        position: absolute; width: 40px; height: 64px; border-radius: var(--radius-chip); z-index: 2;
        border: var(--stroke-dashed); background: var(--paper); color: var(--ink);
        font: 600 18px/1 var(--font-sans); display: grid; place-items: center; cursor: pointer;
      }
      .chrono-btn:hover { background: var(--chip); }
      .chrono-btn:active { background: var(--accent); color: var(--accent-ink); border-style: solid; }
      .chrono-btn.tl { left: 4px; top: 26px; transform: rotate(-18deg); }
      .chrono-btn.bl { left: 4px; bottom: 26px; transform: rotate(18deg); }
      .chrono-btn.tr { right: 4px; top: 26px; transform: rotate(18deg); }
      .chrono-btn.br { right: 4px; bottom: 26px; transform: rotate(-18deg); }

      .left-stack {
        grid-column: 1;
        grid-row: 2;
        align-self: end;
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-height: 0;
        position: relative;
        z-index: 2;
      }
      .new-note {
        flex: none; align-self: flex-start; margin-left: 10px; width: 188px; height: 40px;
        border-radius: var(--radius-pill); background: var(--accent); color: var(--accent-ink);
        border: var(--stroke); box-shadow: var(--shadow);
        font: 600 11px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer;
      }
      .new-note:hover { filter: brightness(0.92); }
      .new-note:active { transform: translateY(2px); box-shadow: 0 2px 0 0 #000000; }

      .todo { flex: none; height: 240px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
      .todo-add { display: flex; gap: 8px; }
      .todo-add input {
        flex: 1; border: var(--stroke); border-radius: var(--radius-pill);
        background: var(--white); padding: 9px 14px; font: inherit; font-size: 13px;
        color: var(--ink); outline: none; min-width: 0;
      }
      .todo-add input::placeholder { color: var(--ink-mut); }
      .todo-add input:focus { box-shadow: 0 3px 0 0 #000000; }
      .todo-add button {
        width: 38px; border-radius: var(--radius-pill); background: var(--accent); color: var(--accent-ink);
        font-size: 18px; font-weight: 600; line-height: 1; border: var(--stroke); box-shadow: 0 3px 0 0 #000000;
      }
      .todo-add button:active { transform: translateY(2px); box-shadow: 0 1px 0 0 #000000; }
      .todo-list { list-style: none; display: flex; flex-direction: column; flex: 1; overflow-y: auto; min-height: 0; }
      .todo-list li { display: flex; align-items: center; gap: 10px; padding: 8px 2px; border-bottom: 2px dashed #2e3138; font-size: 13.5px; }
      .todo-list li:last-child { border-bottom: 0; }
      .todo-check {
        width: 20px; height: 20px; border-radius: 50%; flex: none; border: 2px solid var(--ink-mut);
        background: transparent; padding: 0; display: grid; place-items: center; color: var(--accent-ink);
      }
      .todo-check:hover { border-color: var(--ink); }
      li.done .todo-check { background: var(--accent); border-color: var(--accent); }
      li .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
      li.done .t { text-decoration: line-through; color: var(--ink-mut); }
      .todo-x { margin-left: auto; background: none; color: var(--ink-mut); font-size: 15px; padding: 2px 6px; opacity: 0; flex: none; }
      li:hover .todo-x { opacity: 1; }
      .w-foot {
        align-self: flex-start; font-size: 11px; font-weight: 600; color: var(--ink-mut);
        border: var(--stroke-dashed); border-radius: var(--radius-pill); padding: 4px 10px;
        text-transform: uppercase; letter-spacing: 0.08em;
      }

      .icon-btn {
        width: 28px; height: 28px; border-radius: var(--radius-chip); border: var(--stroke-dashed);
        background: var(--paper); color: var(--ink); display: grid; place-items: center; cursor: pointer;
      }
      .icon-btn:hover { background: var(--chip); }
      .icon-btn.on, .icon-btn.is-on { background: var(--accent); color: var(--accent-ink); border-style: solid; }
      .icon-btn svg { width: 14px; height: 14px; display: block; }
      .now {
        grid-column: 3; grid-row: 2; align-self: end; height: 118px;
        padding: 12px 14px; display: flex; flex-direction: column; gap: 10px;
      }
      .media-row { display: flex; gap: 12px; align-items: center; flex: 1; min-height: 0; }

    <script>
      (function boot() {
        const params = new URLSearchParams(location.search || '');
        let m = (params.get('m') || 'desktop').trim().toLowerCase().replace(/-/g, '_');
        if (m === 'spawnables') m = 'spawn';
        if (m === 'actionbar') m = 'action_bar';
        const idRaw = (params.get('id') || '').trim();
        const id = idRaw === 'calc' ? 'calculator' : idRaw;
        document.documentElement.dataset.mode = m;
        document.body.dataset.mode = m;
        if (id) document.body.dataset.spawnId = id;

        const desktop = document.getElementById('desktop');
        const preview = document.getElementById('preview-root');

        function runScripts(root) {
          root.querySelectorAll('script').forEach(function (old) {
            const s = document.createElement('script');
            Array.prototype.slice.call(old.attributes || []).forEach(function (a) {
              s.setAttribute(a.name, a.value);
            });
            s.textContent = old.textContent;
            old.replaceWith(s);
          });
        }

        function materialize(tpl, solo) {
          const wrap = document.createElement('section');
          wrap.className = 'spawn-surface' + (solo ? ' solo' : '');
          wrap.dataset.id = tpl.getAttribute('data-id') || '';
          const hooks = tpl.getAttribute('data-hooks');
          if (hooks) wrap.setAttribute('data-hooks', hooks);
          wrap.appendChild(tpl.content.cloneNode(true));
          return wrap;
        }

        function mountSpawn(tpl, solo, parent) {
          const wrap = materialize(tpl, solo);
          parent.appendChild(wrap);
          runScripts(wrap);
          return wrap;
        }

        function spawnables(includeBar) {
          return Array.prototype.slice.call(document.querySelectorAll('template.spawnable')).filter(function (t) {
            return includeBar || !t.classList.contains('action-bar');
          });
        }

        function findSpawn(needle) {
          const want = (needle || '').toLowerCase();
          return spawnables(true).find(function (t) {
            const sid = (t.getAttribute('data-id') || '').toLowerCase();
            return sid === want || (want === 'calc' && sid === 'calculator') || (want === 'calculator' && sid === 'calc');
          });
        }

        if (m === 'desktop') return;

        desktop.hidden = true;
        preview.hidden = false;
        document.body.classList.add('preview');

        if (m === 'widgets') {
          document.body.classList.add('preview-widgets');
          Array.prototype.slice.call(desktop.querySelectorAll('article.widget')).forEach(function (el) {
            preview.appendChild(el);
          });
          return;
        }

        desktop.remove();

        if (m === 'action_bar') {
          document.body.classList.add('preview-action');
          const tpl = document.querySelector('template.action-bar, template.spawnable[data-id="action-bar"]');
          if (tpl) mountSpawn(tpl, true, preview);
          return;
        }

        if (m === 'spawn') {
          if (id) {
            document.documentElement.classList.add('overlay');
            const tpl = findSpawn(id);
            if (!tpl) {
              const p = document.createElement('p');
              p.className = 'unknown-spawn';
              p.textContent = 'unknown spawnable: ' + id;
              preview.appendChild(p);
              return;
            }
            const hosted = !!(window.__TAURI_INTERNALS__ || window.__TAURI__);
            if (!hosted) {
              const w = tpl.getAttribute('data-w');
              const h = tpl.getAttribute('data-h');
              if (w) document.body.style.width = w + 'px';
              if (h) document.body.style.height = h + 'px';
            }
            preview.style.padding = '0';
            mountSpawn(tpl, true, preview);
            return;
          }
          spawnables(false).forEach(function (t) { mountSpawn(t, false, preview); });
          return;
        }

        const p = document.createElement('p');
        p.className = 'unknown-spawn';
        p.textContent = 'unknown mode: ' + m;
        preview.appendChild(p);
      })();

    <script>
      (function pomodoroWidget() {

        const defaults = { focus: 25, short: 5, long: 15, longAfter: 4, sound: true, notify: true, mode: 'focus', running: false, endAt: 0, left: 25 * 60, doneFocus: 0 };

          s.running = false; s.endAt = 0; s.left = modeSecs(); stopLoop(); persist(); paint();
        });
        const COG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>';
        const CLOSE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
        const gear = document.getElementById('pomo-gear');
        function setSettings(open) {
          shell.classList.toggle('is-settings', open);
          gear.innerHTML = open ? CLOSE : COG;
          if (!open) { requestAnimationFrame(layoutFrame); paint(); }
        }
        gear.addEventListener('click', function (ev) {
          ev.preventDefault(); ev.stopPropagation();
          setSettings(!shell.classList.contains('is-settings'));
        });
        function stepper(key, min, max, suffix, title) {
          const col = document.createElement('div');
          col.className = 'counter';
          col.innerHTML = '<span>' + title + '</span><div class="stepper"><button type="button" class="step" data-d="-1">−</button><b></b><button type="button" class="step" data-d="1">+</button></div>';
          const b = col.querySelector('b');
          function show() { b.textContent = s[key] + suffix; }
          col.querySelectorAll('.step').forEach(function (btn) {
            btn.addEventListener('click', function () {
              s[key] = Math.min(max, Math.max(min, s[key] + Number(btn.dataset.d)));
              if (!s.running) s.left = modeSecs();
              persist(); show(); paint();
            });
          });
          show();
          return col;
        }
        const BELL_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>';
        const BELL_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 10.5-4"/><path d="M18 8c0 7 3 9 3 9H8"/><path d="M10 21a2 2 0 0 0 4 0"/><path d="M3 3l18 18"/></svg>';
        const chimeBtn = document.getElementById('pomo-chime');
        function paintChime() {
          chimeBtn.classList.toggle('on', !!s.sound);
          chimeBtn.innerHTML = s.sound ? BELL_ON : BELL_OFF;
        }
        chimeBtn.addEventListener('click', function (ev) {
          ev.preventDefault(); ev.stopPropagation();
          s.sound = !s.sound; persist(); paintChime(); if (s.sound) chime();
        });
        document.getElementById('pomo-rows').append(stepper('focus', 1, 90, 'm', 'Focus'), stepper('short', 1, 30, 'm', 'Short'), stepper('long', 5, 60, 'm', 'Long'));
        paintChime();
        if (s.running && s.endAt) {
          if (remaining() <= 0) { s.running = false; s.endAt = 0; s.left = 0; nextMode(); }
          else startLoop();
        }
        persist(); paint(); layoutFrame();
        new ResizeObserver(layoutFrame).observe(shell);
      })();
    </script>
    <script>
      (function nowPlaying() {
        const shell = document.getElementById('np-shell');
        if (!shell) return;
        const titleEl = document.getElementById('np-title');
        const artistEl = document.getElementById('np-artist');
        const art = document.getElementById('np-art');
        const progress = document.getElementById('np-progress');
        const timeCur = document.getElementById('np-time-cur');
        const timeDur = document.getElementById('np-time-dur');
        const prevBtn = document.getElementById('np-prev');
        const toggleBtn = document.getElementById('np-toggle');
        const toggleIcon = document.getElementById('np-toggle-icon');
        const nextBtn = document.getElementById('np-next');
        const ICON_PLAY = '<path d="M8 5v14l11-7z"/>';
        const ICON_PAUSE = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
        let busy = false, lastArt = '', lastInfo = null, idleHits = 0;
        const media = function () {
          return (window.versailles && window.versailles.for)
            ? window.versailles.for('now-playing').media
            : null;
        };
        function setButtonsEnabled(on) {
          prevBtn.disabled = !on; toggleBtn.disabled = !on; nextBtn.disabled = !on;
        }
        function isIdle(info) { return !info || info.host === false || info.hasSession === false || info.status === 'no-session'; }
        function fmtMs(ms) {
          if (!(ms > 0)) return '--:--';
          const s = Math.floor(ms / 1000);
          return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
        }
        function render(info) {
          if (!info) return;
          if (isIdle(info)) {
            idleHits += 1;
            if (lastInfo && !isIdle(lastInfo) && idleHits < 3) return;
            shell.classList.add('idle');
            titleEl.textContent = 'Nothing playing';
            artistEl.textContent = info.host === false ? 'Host required for media' : 'Play something to get started';
            art.removeAttribute('src'); lastArt = '';
            progress.style.width = '0%';
            timeCur.textContent = '--:--'; timeDur.textContent = '--:--';
            toggleIcon.innerHTML = ICON_PLAY;
            setButtonsEnabled(false);
            lastInfo = info;
            return;
          }
          idleHits = 0; lastInfo = info; shell.classList.remove('idle');
          titleEl.textContent = info.title || 'Untitled';
          const bits = [info.artist, info.album].filter(Boolean);
          artistEl.textContent = bits.length ? bits.join(' · ') : (info.source || info.status || 'Playing');
          if (info.thumbnailDataUrl && info.thumbnailDataUrl !== lastArt) { art.src = info.thumbnailDataUrl; lastArt = info.thumbnailDataUrl; }
          const pct = info.durationMs > 0 ? Math.min(100, (info.positionMs / info.durationMs) * 100) : 0;
          progress.style.width = pct + '%';
          timeCur.textContent = fmtMs(info.positionMs);
          timeDur.textContent = fmtMs(info.durationMs);
          toggleIcon.innerHTML = info.status === 'paused' ? ICON_PLAY : ICON_PAUSE;
          setButtonsEnabled(true);
        }
        async function mediaFetch(path, method) {
          const res = await fetch(path, { method: method || 'GET', headers: { Accept: 'application/json' } });
          if (!res.ok) throw new Error('media ' + res.status);
          if (res.status === 204) return null;
          const ct = res.headers.get('content-type') || '';
          if (ct.indexOf('json') >= 0) return res.json();
          return null;
        }
        async function refresh() {
          try {
            const api = media();
            if (api) render(await api.now());
            else render(await mediaFetch('/media/now', 'GET'));
          } catch (err) { console.warn('media refresh', err); }
        }
        async function runControl(fn) {
          if (busy) return;
          busy = true;
          try { await fn(); await refresh(); setTimeout(function () { void refresh(); }, 250); }
          catch (err) { console.error('media control', err); }
          finally { busy = false; }
        }
        function bindControl(btn, fn) {
          btn.addEventListener('pointerdown', function (e) { e.stopPropagation(); }, true);
          btn.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); runControl(fn); });
        }
        document.getElementById('np-controls').addEventListener('pointerdown', function (e) { e.stopPropagation(); }, true);
        bindControl(prevBtn, function () {
          const api = media();
          return api ? api.previous() : mediaFetch('/media/previous', 'POST');
        });
        bindControl(nextBtn, function () {
          const api = media();
          return api ? api.next() : mediaFetch('/media/next', 'POST');
        });
        bindControl(toggleBtn, function () {
          const api = media();
          return api ? api.playPause() : mediaFetch('/media/play-pause', 'POST');
        });
        setButtonsEnabled(false);
        function start() {
          void refresh();
          const api = media();
          if (api && api.onUpdate) {
            api.onUpdate(function (info) { render(info); }).catch(function (err) {
              console.warn('media onUpdate', err);
              setInterval(refresh, 4000);
            });
            return;
          }
          setInterval(refresh, 4000);
        }
        (function wait(n) {
          if (window.versailles || n <= 0) start();
          else setTimeout(function () { wait(n - 1); }, 50);
        })(20);
      })();
    </script>
    <script>
      (function notepadLayer() {
        const STORAGE_KEY = 'deck_notepads_v2';
        const LEGACY_KEY = 'deck_notepads_v1';
        const OLD_NOTES = 'deck-notes';
        const layer = document.getElementById('notes-layer');
        const stage = document.getElementById('desktop');
        const newBtn = document.getElementById('new-note');
        if (!layer || !stage || !newBtn) return;
        const PIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M8 3h8l-1 7a4 4 0 1 1-6 0L8 3z"/></svg>';
        const BUCKET = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M6 7l1 13h10l1-13"/><path d="M10 11v6M14 11v6"/></svg>';
        let notes = [];
        let zTop = 10;
        let saveTimer = null;
        function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
        function persist() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(notes)); } catch (_) {} }
        function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(persist, 180); }
        function nextZ() { zTop += 1; return zTop; }
        function load() {
          const mapOne = function (n, i) {
            return {
              id: String(n.id || uid()), text: String(n.text || ''), pinned: !!n.pinned,
              x: Number.isFinite(n.x) ? n.x : 420 + (i % 5) * 28,
              y: Number.isFinite(n.y) ? n.y : 80 + (i % 5) * 28,
              z: Number(n.z) || (10 + i)
            };
          };
          try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) { const parsed = JSON.parse(raw); if (Array.isArray(parsed)) return parsed.filter(Boolean).map(mapOne); }
          } catch (_) {}
          try {
            const raw = localStorage.getItem(LEGACY_KEY);
            if (raw) { const parsed = JSON.parse(raw); if (Array.isArray(parsed)) return parsed.filter(Boolean).map(mapOne); }
          } catch (_) {}
          try {
            const legacy = localStorage.getItem(OLD_NOTES);
            if (typeof legacy === 'string' && legacy.trim()) return [mapOne({ text: legacy }, 0)];
          } catch (_) {}
          return [];
        }
        function fitArea(area) { area.style.height = 'auto'; area.style.height = Math.max(72, area.scrollHeight) + 'px'; }
        function clampNote(note, el) {
          const maxX = Math.max(52, stage.clientWidth - (el ? el.offsetWidth : 240) - 8);
          const maxY = Math.max(8, stage.clientHeight - (el ? el.offsetHeight : 90) - 8);
          note.x = Math.min(maxX, Math.max(52, note.x));
          note.y = Math.min(maxY, Math.max(8, note.y));
        }
        function renderNote(note) {
          const card = document.createElement('article');
          card.className = 'pad' + (note.pinned ? ' is-pinned' : '');
          card.dataset.id = note.id;
          card.style.left = note.x + 'px';
          card.style.top = note.y + 'px';
          card.style.zIndex = String(note.z || 10);
          const area = document.createElement('textarea');
          area.placeholder = 'Write something…';
          area.value = note.text;
          area.spellcheck = false;
          const tools = document.createElement('div');
          tools.className = 'pad-tools';
          const pin = document.createElement('button');
          pin.type = 'button';
          pin.className = 'icon-btn' + (note.pinned ? ' is-on' : '');
          pin.setAttribute('aria-label', note.pinned ? 'Unpin' : 'Lock in place');
          pin.innerHTML = PIN;
          const del = document.createElement('button');
          del.type = 'button';
          del.className = 'icon-btn danger';
          del.setAttribute('aria-label', 'Delete note');
          del.innerHTML = BUCKET;
          tools.append(pin, del);
          card.append(area, tools);
          layer.appendChild(card);
          fitArea(area);
          function raise() { note.z = nextZ(); card.style.zIndex = String(note.z); scheduleSave(); }
          function applyPin() {
            card.classList.toggle('is-pinned', note.pinned);
            pin.classList.toggle('is-on', note.pinned);
            pin.setAttribute('aria-label', note.pinned ? 'Unpin' : 'Lock in place');
          }
          function stopPad(ev) { ev.preventDefault(); ev.stopPropagation(); }
          tools.addEventListener('pointerdown', stopPad);
          pin.addEventListener('click', function (ev) { ev.preventDefault(); ev.stopPropagation(); note.pinned = !note.pinned; applyPin(); persist(); });
          del.addEventListener('click', function (ev) {
            ev.preventDefault(); ev.stopPropagation();
            notes = notes.filter(function (n) { return n.id !== note.id; });
            persist(); card.remove();
          });
          area.addEventListener('input', function () { note.text = area.value; fitArea(area); scheduleSave(); });
          card.addEventListener('pointerdown', function (ev) {
            if (ev.button !== 0) return;
            if (ev.target.closest('.pad-tools') || ev.target.closest('.icon-btn')) return;
            raise();
            if (note.pinned) return;
            const startX = ev.clientX, startY = ev.clientY, origX = note.x, origY = note.y;
            let moved = false;
            const onText = ev.target === area;
            function onMove(e) {
              const dx = e.clientX - startX, dy = e.clientY - startY;
              if (!moved && Math.abs(dx) + Math.abs(dy) < 6) return;
              if (!moved) { moved = true; if (onText) area.blur(); card.classList.add('is-dragging'); }
              note.x = origX + dx; note.y = origY + dy;
              clampNote(note, card);
              card.style.left = note.x + 'px'; card.style.top = note.y + 'px';
            }
            function onUp() {
              window.removeEventListener('pointermove', onMove);
              window.removeEventListener('pointerup', onUp);
              card.classList.remove('is-dragging');
              if (moved) persist();
            }
            window.addEventListener('pointermove', onMove);
            window.addEventListener('pointerup', onUp);
          });
        }
        newBtn.addEventListener('click', function () {
          const i = notes.length;
          const note = { id: uid(), text: '', pinned: false, x: 380 + (i % 6) * 26, y: 72 + (i % 6) * 26, z: nextZ() };
          notes.push(note); persist(); renderNote(note);
          const area = layer.lastElementChild && layer.lastElementChild.querySelector('textarea');
          if (area) area.focus();
        });
        notes = load();
        notes.forEach(function (n) { if (n.z > zTop) zTop = n.z; });
        notes.forEach(renderNote);
        window.addEventListener('versailles:restore', function () {
          notes = load();
          layer.querySelectorAll('.pad:not(.draw-pin)').forEach(function (el) { el.remove(); });
          notes.forEach(function (n) { if (n.z > zTop) zTop = n.z; });
          notes.forEach(renderNote);
        });
      })();
    </script>
    <script>
      (function drawInPage() {
        var btn = document.getElementById('new-draw');
        if (btn) {
          btn.addEventListener('click', function () {
            var v = window.versailles;
            if (v && v.for) {
              v.for('draw').spawn('draw').catch(function () {});
            }
          });
        }
        var PIN_KEY = 'deck-draw-pins-v1';
        var layer = document.getElementById('notes-layer');
        var stage = document.getElementById('desktop');
        if (!layer || !stage) return;
        var pins = [];
        function persistPins() {
          try { localStorage.setItem(PIN_KEY, JSON.stringify(pins)); } catch (_) {}
        }
        function renderPin(pin) {
          if (layer.querySelector('[data-pin-id="' + pin.id + '"]')) return;
          var card = document.createElement('article');
          card.className = 'pad draw-pin';
          card.dataset.pinId = pin.id;
          card.style.left = (pin.x || 400) + 'px';
          card.style.top = (pin.y || 70) + 'px';
          card.style.zIndex = String(pin.z || 20);
          var art = document.createElement('div');
          art.className = 'draw-pin-art';
          art.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' +
            (pin.viewBox || '0 0 720 460') + '" width="100%" height="100%">' +
            '<rect width="100%" height="100%" fill="#15161a"/>' + (pin.svg || '') + '</svg>';
          var tools = document.createElement('div');
          tools.className = 'pad-tools';
          var del = document.createElement('button');
          del.type = 'button';
          del.className = 'icon-btn danger';
          del.setAttribute('aria-label', 'Remove pin');
          del.textContent = '×';
          tools.appendChild(del);
          card.append(art, tools);
          layer.appendChild(card);
          del.addEventListener('click', function (ev) {
            ev.preventDefault();
            ev.stopPropagation();
            pins = pins.filter(function (p) { return p.id !== pin.id; });
            persistPins();
            card.remove();
          });
          card.addEventListener('pointerdown', function (ev) {
            if (ev.button !== 0 || ev.target.closest('.pad-tools')) return;
            var startX = ev.clientX, startY = ev.clientY, origX = pin.x || 0, origY = pin.y || 0, moved = false;
            function onMove(e) {
              var dx = e.clientX - startX, dy = e.clientY - startY;
              if (!moved && Math.abs(dx) + Math.abs(dy) < 6) return;
              moved = true;
              pin.x = origX + dx;
              pin.y = origY + dy;
              card.style.left = pin.x + 'px';
              card.style.top = pin.y + 'px';
            }
            function onUp() {
              window.removeEventListener('pointermove', onMove);
              window.removeEventListener('pointerup', onUp);
              if (moved) persistPins();
            }
            window.addEventListener('pointermove', onMove);
            window.addEventListener('pointerup', onUp);
          });
        }
        function loadPins() {
          try { pins = JSON.parse(localStorage.getItem(PIN_KEY) || '[]'); } catch (_) { pins = []; }
          if (!Array.isArray(pins)) pins = [];
          pins.forEach(renderPin);
        }
        loadPins();
        window.addEventListener('storage', function (e) {
          if (e.key === PIN_KEY) loadPins();
        });
      })();
    </script>
