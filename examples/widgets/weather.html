<!-- Paste into desktop/index.html. Unique data-id="weather". Host GET /weather. -->
<style>
  .weather { width: 174px; height: 168px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
  .wx-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 28px; }
  .wx-place { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: text; flex: 1; }
  .wx-loc {
    display: none; flex: 1; min-width: 0; height: 28px;
    border: var(--stroke-dashed); background: var(--white); color: var(--ink);
    border-radius: var(--radius-chip); padding: 0 10px;
    font: 600 11px/1 var(--font-sans); letter-spacing: 0.04em; text-transform: uppercase; outline: none;
  }
  .weather.is-editing .wx-place, .weather.is-error .wx-place { display: none; }
  .weather.is-editing .wx-loc, .weather.is-error .wx-loc { display: block; }
  .wx-loc:focus { border-style: solid; }
  .wx-glyph { flex: none; width: 28px; height: 28px; }
  .wx-glyph svg { display: block; width: 100%; height: 100%; }
  .wx-temp { font: 600 52px var(--font-sans); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1; }
  .wx-meta { font-size: 12px; line-height: 1.3; color: var(--ink-mut); }
  .weather.is-error .wx-temp { color: var(--ink-mut); }
  .weather.is-error .wx-glyph { visibility: hidden; }
</style>
<article class="widget weather" data-id="weather" id="wx-shell">
  <div class="wx-top">
    <div class="wx-place" id="wx-place">—</div>
    <input class="wx-loc" id="wx-loc" type="text" placeholder="City" spellcheck="false" autocomplete="off" data-no-drag />
    <div class="wx-glyph" id="wx-glyph" aria-hidden="true"></div>
  </div>
  <div class="wx-temp" id="wx-temp">--°</div>
  <div class="wx-meta" id="wx-meta"></div>
</article>
<script>
  (function weatherWidget() {
    const shell = document.getElementById('wx-shell');
    if (!shell) return;
    const placeEl = document.getElementById('wx-place');
    const tempEl = document.getElementById('wx-temp');
    const metaEl = document.getElementById('wx-meta');
    const glyphEl = document.getElementById('wx-glyph');
    const locEl = document.getElementById('wx-loc');
    const SVG = {
      sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.4"/><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8 5.6 18.4"/></svg>',
      cloud: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 18h9.2a3.4 3.4 0 0 0 .5-6.7 4.8 4.8 0 0 0-9.2-1.2A3.1 3.1 0 0 0 7.5 18z"/></svg>',
      rain: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15h10a3.5 3.5 0 0 0 .6-6.9A5 5 0 0 0 8 9.3 3.2 3.2 0 0 0 7 15z"/><path d="M8.5 18.2v2.4M12 18.2v2.4M15.5 18.2v2.4"/></svg>',
      snow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v16M6.5 7.5l11 9M17.5 7.5l-11 9"/></svg>',
      fog: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9h16M6 13h12M8 17h8"/></svg>',
      storm: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 14h9.4a3.2 3.2 0 0 0 .6-6.3A4.6 4.8 0 0 0 8.2 8.6 3 3 0 0 0 7 14z"/><path d="M11 14l-1.8 4.2h3.2L11 22"/></svg>',
      mix: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 14h10a3.5 3.5 0 0 0 .6-6.9A5 5 0 0 0 8 8.3 3.2 3.2 0 0 0 7 14z"/><path d="M9 17.4v2.2M15 17.4v2.2"/></svg>'
    };
    function render(data) {
      shell.classList.remove('is-error');
      placeEl.textContent = data.place || 'Local';
      tempEl.textContent = (data.tempC != null) ? (data.tempC + '°') : '--°';
      const range = (data.highC != null && data.lowC != null) ? ('H ' + data.highC + '°  L ' + data.lowC + '°') : '';
      metaEl.textContent = range ? ((data.desc || '') + ' · ' + range) : (data.desc || '');
      glyphEl.innerHTML = SVG[data.glyph] || SVG.cloud;
    }
    async function load(explicit) {
      try {
        let url = '/weather';
        if (explicit != null) {
          url = '/weather?save=1';
          if (explicit) url += '&location=' + encodeURIComponent(explicit);
        }
        const res = await fetch(url, { headers: { Accept: 'application/json' } });
        const data = await res.json();
        if (!data || data.ok === false) throw new Error();
        shell.classList.remove('is-editing');
        render(data);
      } catch (_) {
        shell.classList.add('is-error');
        placeEl.textContent = 'Weather';
        tempEl.textContent = '—';
        metaEl.textContent = 'weather unavailable';
      }
    }
    locEl.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape') { shell.classList.remove('is-editing'); return; }
      if (ev.key !== 'Enter') return;
      ev.preventDefault();
      load(locEl.value.trim());
    });
    placeEl.addEventListener('click', function () {
      locEl.value = placeEl.textContent === '—' ? '' : placeEl.textContent;
      shell.classList.add('is-editing');
      locEl.focus();
    });
    load();
    setInterval(function () { load(); }, 20 * 60 * 1000);
  })();
</script>
