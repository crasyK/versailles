<!-- Paste into desktop/index.html. Unique data-id="password". -->
<style>
  .password { width: 300px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .pass-out {
    display: flex; align-items: center; gap: 8px; border: var(--stroke); border-radius: 12px;
    background: var(--white); padding: 4px 4px 4px 12px;
  }
  .pass-out code { flex: 1; font-size: 13.5px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-family: var(--font-mono); }
  .pass-out button {
    border-radius: var(--radius-chip); border: var(--stroke-dashed); background: var(--paper);
    font: 600 11px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; padding: 7px 12px;
  }
  .pass-opts { display: flex; gap: 6px; flex-wrap: wrap; }
  .pass-opts button, .password .go {
    height: 28px; padding: 0 12px; border-radius: var(--radius-chip); border: var(--stroke-dashed);
    background: var(--paper); font: 600 11px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase;
  }
  .pass-opts button.on, .password .go { background: var(--ink); color: var(--paper); border-style: solid; }
</style>
<article class="widget password" data-id="password">
  <div class="pass-out">
    <code id="pass-code">…</code>
    <button id="pass-copy" type="button">Copy</button>
  </div>
  <div class="pass-opts" id="pass-lens">
    <button type="button" data-len="8">8</button>
    <button type="button" data-len="12">12</button>
    <button type="button" class="on" data-len="16">16</button>
    <button type="button" data-len="24">24</button>
    <button type="button" class="on" id="pass-sym">Symbols</button>
  </div>
  <button class="go" id="pass-gen" type="button">Generate</button>
</article>
<script>
  (function passwordWidget() {
    const code = document.getElementById('pass-code');
    if (!code) return;
    const copy = document.getElementById('pass-copy');
    const sym = document.getElementById('pass-sym');
    const lens = document.getElementById('pass-lens');
    let len = 16, useSym = true, copyTimer = null;
    function gen() {
      let chars = 'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      if (useSym) chars += '!@#$%^&*?+-=';
      const buf = new Uint32Array(len);
      crypto.getRandomValues(buf);
      code.textContent = Array.from(buf, function (n) { return chars[n % chars.length]; }).join('');
      copy.textContent = 'Copy';
    }
    lens.onclick = function (e) {
      const b = e.target.closest('button');
      if (!b || b === sym) return;
      len = +b.dataset.len;
      lens.querySelectorAll('[data-len]').forEach(function (c) { c.classList.toggle('on', c === b); });
      gen();
    };
    sym.onclick = function () { useSym = !useSym; sym.classList.toggle('on', useSym); gen(); };
    document.getElementById('pass-gen').onclick = gen;
    copy.onclick = async function () {
      clearTimeout(copyTimer);
      try { await navigator.clipboard.writeText(code.textContent); copy.textContent = 'Copied'; }
      catch (_) { copy.textContent = 'Select'; }
      copyTimer = setTimeout(function () { copy.textContent = 'Copy'; }, 1200);
    };
    gen();
  })();
</script>
