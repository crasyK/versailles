[package]
name = "deck"
version = "0.1.0"
description = "Deck — lightweight HTML desktop widget host"
authors = ["you"]
edition = "2021"

[lib]
name = "deck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
notify = "7"
dirs = "6"
schemars = "0.8"
url = "2"
sysinfo = "0.30"
portable-pty = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Foundation",
  "Devices_Geolocation",
  "Media_Control",
  "Storage_Streams",
  "Graphics_Imaging",
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_Graphics_Gdi",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true

# Debug ACL context overflows Tauri's default 8MiB thread on Windows.
[patch.crates-io]
tauri-codegen = { path = "vendor/tauri-codegen" }
