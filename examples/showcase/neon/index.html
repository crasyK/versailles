<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Neon</title>
    <!--
      Neon: a Versailles showcase desktop (synthwave / outrun).

      Copy this file to %USERPROFILE%\Documents\Widgets\desktop\index.html.
      Pieces:
        article.widget  neon-clock   chrome clock and the part of the day
        article.widget  neon-tape    now playing as a cassette (media)
        article.widget  neon-dash    battery as a fuel gauge, Wi-Fi signal (battery, network)
        template        neon-rail    left side rail: the open windows (windows, windows-control)
        template        neon-qs      quick settings slide-out, Win+A or the Copilot key
      The wallpaper is one <canvas>: sky, striped sun, mountains and a moving grid.
      It runs at 30 fps, stops while you are away (idle) and draws one still
      frame with reduced motion.
    -->
    <script type="application/json" id="versailles">
    {
      "shell": { "hideTaskbar": true }
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Kanit:ital,wght@1,800;1,900&family=Mr+Dafoe&display=swap" rel="stylesheet" />
    <style>
      :root {
        --night: #07021a;
        --plum: #1a0636;
        --violet: #3b0d6b;
        --magenta: #ff2bd6;
        --pink: #ff4f9a;
        --sun: #ffd23f;
        --orange: #ff8a3d;
        --cyan: #29e7ff;
        --ice: #e8f7ff;
        --mute: #b79bd8;
        --font-ui: "Chakra Petch", "Bahnschrift", "Segoe UI", sans-serif;
        --font-chrome: "Kanit", "Arial Black", "Segoe UI Black", sans-serif;
        --font-script: "Mr Dafoe", "Brush Script MT", "Segoe Script", cursive;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; }
      body {
        background: var(--night);
        color: var(--ice);
        font-family: var(--font-ui);
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      html.overlay, html.overlay body { width: 100% !important; height: 100% !important; overflow: hidden; }
      button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
      button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

      /* ---------- wallpaper ---------- */
      #desktop { position: fixed; inset: 0; overflow: hidden; }
      #neon-sky { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #desktop::after { /* a faint CRT texture over the whole scene */
        content: ""; position: absolute; inset: 0; pointer-events: none;
        background: repeating-linear-gradient(180deg, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.10) 2px 3px);
        mix-blend-mode: multiply;
      }

      /* clock: chrome numerals over the sun */
      .clock {
        position: absolute; left: 50%; top: 6vh; transform: translateX(-50%);
        display: flex; flex-direction: column; align-items: center; z-index: 2; pointer-events: none;
      }
      .chrome {
        position: relative; display: block;
        font: italic 900 min(14.5vw, 25vh)/0.92 var(--font-chrome);
        letter-spacing: -0.02em; padding: 0 0.12em;
        font-variant-numeric: tabular-nums;
      }
      .chrome .fill {
        position: relative; z-index: 1; display: block;
        background: linear-gradient(180deg,
          #f4fbff 0%, #a5e6ff 22%, #4ec3ff 44%, #fdfdff 50%,
          #2a0b4a 50.5%, #5d1d87 62%, #ff63b8 82%, #ffe1f3 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        /* chained shadows: each one offsets the last, so they stack into an extrusion */
        filter: drop-shadow(2px 2px 0 #3b0a62) drop-shadow(2px 2px 0 #4a0c78) drop-shadow(2px 2px 0 #5a0f8a)
                drop-shadow(3px 3px 0 #ff2bd6) drop-shadow(0 0 22px rgba(255, 43, 214, 0.7)) drop-shadow(0 0 60px rgba(255, 79, 154, 0.45));
      }
      .daypart {
        margin-top: -0.48em; margin-left: 3.2em; transform: rotate(-7deg);
        font: 400 min(6.4vw, 11vh)/1 var(--font-script);
        color: #fff2fb;
        text-shadow: 0 0 6px #ff4fd8, 0 0 18px #ff2bd6, 0 0 42px #ff2bd6, 0 0 80px rgba(255, 43, 214, 0.6);
        z-index: 3; position: relative; white-space: nowrap;
      }
      .datebar {
        margin-bottom: 1.2vh; display: flex; gap: 18px; align-items: center;
        font: 600 18px/1 var(--font-ui); letter-spacing: 0.32em; color: #ffd9f2;
        text-shadow: 0 0 10px rgba(255, 43, 214, 0.8);
      }
      .datebar i { width: 46px; height: 2px; background: linear-gradient(90deg, transparent, var(--cyan)); box-shadow: 0 0 8px var(--cyan); }
      .datebar i:last-child { background: linear-gradient(90deg, var(--cyan), transparent); }

      /* shared panel: a lit sign with chamfered corners */
      .sign {
        position: absolute; z-index: 2;
        filter: drop-shadow(0 0 10px rgba(41, 231, 255, 0.55)) drop-shadow(0 0 28px rgba(255, 43, 214, 0.35));
      }
      .sign-frame {
        --cut: 18px;
        clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
        background: linear-gradient(135deg, var(--cyan), #8b5cff 45%, var(--magenta));
        padding: 2px;
      }
      .sign-body {
        clip-path: inherit;
        background:
          linear-gradient(180deg, rgba(37, 9, 70, 0.92), rgba(12, 3, 30, 0.94));
        position: relative;
      }

      /* now playing: a cassette */
      .tape-w { left: 4.2vw; bottom: 6.5vh; width: 452px; }
      .tape-w .sign-body { padding: 18px 18px 16px; }
      .cassette {
        position: relative; height: 252px; border-radius: 14px;
        background: linear-gradient(180deg, #2b0f4d, #160631);
        box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.14), inset 0 -40px 60px rgba(0, 0, 0, 0.35);
      }
      .cassette .screw { position: absolute; width: 9px; height: 9px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #c9b6e6, #4b3470); }
      .cassette .screw::after { content: ""; position: absolute; left: 1px; right: 1px; top: 4px; height: 1px; background: #241238; transform: rotate(35deg); }
      .label {
        position: absolute; left: 16px; right: 16px; top: 14px; height: 168px; border-radius: 8px; overflow: hidden;
        background: #3a1060;
      }
      .label .art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: saturate(1.25) contrast(1.05); }
      .label .art:not([src]) { display: none; }
      .label .shade { position: absolute; inset: 0; background:
        linear-gradient(90deg, rgba(20, 4, 44, 0.92) 0%, rgba(20, 4, 44, 0.55) 55%, rgba(20, 4, 44, 0.15) 100%),
        linear-gradient(180deg, rgba(255, 43, 214, 0.18), rgba(41, 231, 255, 0.10)); }
      .label .stripes { position: absolute; left: 0; right: 0; top: 92px; height: 34px; display: flex; flex-direction: column; }
      .label .stripes b { flex: 1; }
      .label .stripes b:nth-child(1) { background: #ffd23f; }
      .label .stripes b:nth-child(2) { background: #ff8a3d; }
      .label .stripes b:nth-child(3) { background: #ff4f9a; }
      .label .stripes b:nth-child(4) { background: #c13ce0; }
      .label .stripes b:nth-child(5) { background: #6a3cff; }
      .label .song {
        position: absolute; left: 16px; right: 64px; top: 8px;
        font: 400 46px/1.15 var(--font-script); color: #fff;
        text-shadow: 0 0 10px rgba(255, 79, 216, 0.9), 0 0 26px rgba(255, 43, 214, 0.6);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 6px 4px 0;
      }
      .label .who {
        position: absolute; left: 18px; top: 62px; right: 70px;
        font: 600 14px/1 var(--font-ui); letter-spacing: 0.18em; color: #ffe6f6;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .label .side {
        position: absolute; right: 14px; top: 12px; width: 40px; height: 40px; border-radius: 50%;
        display: grid; place-items: center; font: italic 900 22px/1 var(--font-chrome); color: #1a0636;
        background: var(--sun); box-shadow: 0 0 14px rgba(255, 210, 63, 0.8);
      }
      .reels {
        position: absolute; left: 50%; top: 98px; transform: translateX(-50%);
        width: 250px; height: 62px; border-radius: 31px;
        background: linear-gradient(180deg, rgba(6, 1, 18, 0.92), rgba(30, 8, 56, 0.92));
        box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.22), 0 0 0 4px rgba(10, 2, 24, 0.55);
      }
      .reels svg { width: 100%; height: 100%; display: block; }
      .reels .hub { transform-box: fill-box; transform-origin: center; }
      .tape-w.playing .reels .hub { animation: spin 2.4s linear infinite; }
      @keyframes spin { to { transform: rotate(-360deg); } }
      .cassette .foot {
        position: absolute; left: 70px; right: 70px; bottom: 0; height: 52px;
        clip-path: polygon(10% 0, 90% 0, 100% 100%, 0 100%);
        background: linear-gradient(180deg, #24093f, #12052a);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
        display: flex; align-items: center; justify-content: center; gap: 56px;
      }
      .cassette .foot i { width: 12px; height: 12px; border-radius: 50%; background: #07021a; box-shadow: inset 0 1px 2px rgba(0,0,0,.8), 0 0 0 1.5px rgba(255,255,255,.12); }
      .cassette .brand {
        position: absolute; left: 22px; bottom: 16px; font: italic 800 15px/1 var(--font-chrome); letter-spacing: 0.04em; color: var(--cyan);
        text-shadow: 0 0 8px rgba(41, 231, 255, 0.8);
      }
      .cassette .len { position: absolute; right: 22px; bottom: 16px; font: 600 13px/1 var(--font-ui); color: var(--mute); letter-spacing: 0.1em; font-variant-numeric: tabular-nums; }
      .deck { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
      .deck button {
        width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none;
        color: var(--cyan); box-shadow: inset 0 0 0 2px rgba(41, 231, 255, 0.75), 0 0 12px rgba(41, 231, 255, 0.35);
      }
      .deck button.big { width: 50px; height: 50px; color: #1a0636; background: linear-gradient(180deg, var(--sun), var(--pink)); box-shadow: 0 0 18px rgba(255, 79, 154, 0.75); }
      .deck button:hover { filter: brightness(1.25); }
      .deck button:disabled { opacity: 0.35; cursor: default; }
      .deck svg { width: 18px; height: 18px; display: block; fill: currentColor; }
      .deck .big svg { width: 22px; height: 22px; }
      .eq { flex: 1; height: 40px; display: flex; align-items: flex-end; gap: 3px; margin-left: 8px; }
      .eq b { flex: 1; height: 30%; border-radius: 2px 2px 0 0;
        background: linear-gradient(0deg, var(--magenta), var(--orange) 70%, var(--sun));
        box-shadow: 0 0 8px rgba(255, 43, 214, 0.55); }
      .tape-w.playing .eq b { animation: eq 0.9s ease-in-out infinite alternate; }
      @keyframes eq { 0% { height: 18%; } 50% { height: 92%; } 100% { height: 36%; } }
      .time { font: 600 15px/1 var(--font-ui); letter-spacing: 0.08em; color: #ffd9f2; font-variant-numeric: tabular-nums; flex: none; min-width: 92px; text-align: right; }
      .tape-w.idle .label .song { color: var(--mute); text-shadow: none; }

      /* battery and Wi-Fi: a dashboard cluster */
      .dash-w { right: 4.2vw; bottom: 6.5vh; width: 452px; }
      .dash-w .sign-body { padding: 18px 22px 18px; display: grid; grid-template-columns: 236px 1fr; gap: 6px 18px; align-items: center; }
      .gauge { position: relative; width: 236px; height: 164px; }
      .gauge svg { width: 100%; height: 100%; display: block; overflow: visible; }
      .gauge .read {
        position: absolute; left: 0; right: 0; top: 70px; text-align: center;
        font: italic 900 60px/1 var(--font-chrome); letter-spacing: -0.02em;
        background: linear-gradient(180deg, #fff 0%, #9ee6ff 48%, #fdfdff 50%, #ff63b8 52%, #ffe1f3 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        filter: drop-shadow(0 0 10px rgba(255, 43, 214, 0.7));
      }
      .gauge .read small { font-size: 26px; }
      .gauge .unit { position: absolute; left: 0; right: 0; top: 136px; text-align: center; font: 600 13px/1 var(--font-ui); letter-spacing: 0.3em; color: var(--mute); }
      .gauge .needle { transform-origin: 118px 118px; transition: transform 1.2s cubic-bezier(.2, .9, .2, 1.1); }
      .sig { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
      .bars { display: flex; align-items: flex-end; gap: 6px; height: 64px; }
      .bars b { width: 16px; border-radius: 3px; background: rgba(183, 155, 216, 0.18); box-shadow: inset 0 0 0 1px rgba(183, 155, 216, 0.25); }
      .bars b:nth-child(1) { height: 20%; } .bars b:nth-child(2) { height: 40%; } .bars b:nth-child(3) { height: 60%; }
      .bars b:nth-child(4) { height: 80%; } .bars b:nth-child(5) { height: 100%; }
      .bars b.on { background: linear-gradient(0deg, #1fb3ff, var(--cyan)); box-shadow: 0 0 12px rgba(41, 231, 255, 0.85); }
      .ssid { font: italic 800 30px/1 var(--font-chrome); color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        text-shadow: 0 0 12px rgba(41, 231, 255, 0.8); padding-right: 4px; }
      .netstate { font: 600 14px/1.2 var(--font-ui); color: var(--mute); letter-spacing: 0.08em; }
      .dash-foot {
        grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center;
        padding-top: 12px; border-top: 1px solid rgba(255, 79, 216, 0.28);
        font: 600 14px/1 var(--font-ui); letter-spacing: 0.12em; color: #ffd9f2;
      }
      .dash-foot .hot { color: var(--sun); text-shadow: 0 0 10px rgba(255, 210, 63, 0.7); }

      /* ---------- previews (?m=widgets / ?m=spawn) ---------- */
      #preview-root { display: none; }
      body.preview { overflow: auto; background: var(--night); }
      body.preview #preview-root { display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; align-items: flex-start; }
      body.preview-widgets .sign, body.preview-widgets .clock { position: relative; inset: auto; transform: none; }
      html.overlay #preview-root, html.overlay body.preview #preview-root { display: flex !important; flex-direction: column; width: 100%; height: 100%; padding: 0; overflow: hidden; }
      html.overlay .spawn-surface.solo { flex: 1; min-height: 0; width: 100%; height: 100%; display: flex; flex-direction: column; }
      .spawn-surface:not(.solo) { width: 380px; min-height: 300px; }
      .unknown-spawn { font: 600 14px/1.4 var(--font-ui); color: var(--pink); padding: 18px; }

      @media (prefers-reduced-motion: reduce) {
        .tape-w.playing .reels .hub, .tape-w.playing .eq b { animation: none; }
      }
    </style>
  </head>
  <body>
    <section id="desktop">
      <canvas id="neon-sky" aria-hidden="true"></canvas>

      <article class="widget clock" data-id="neon-clock">
        <span class="datebar"><i></i><span id="nc-date"></span><i></i></span>
        <span class="chrome" id="nc-time"><span class="fill" id="nc-fill">--:--</span></span>
        <span class="daypart" id="nc-part"></span>
      </article>

      <article class="widget sign tape-w idle" data-id="neon-tape" data-hooks="media" id="nt">
        <div class="sign-frame"><div class="sign-body">
          <div class="cassette">
            <span class="screw" style="left:8px;top:8px"></span><span class="screw" style="right:8px;top:8px"></span>
            <span class="screw" style="left:8px;bottom:8px"></span><span class="screw" style="right:8px;bottom:8px"></span>
            <div class="label">
              <img class="art" id="nt-art" alt="" />
              <div class="shade"></div>
              <div class="stripes"><b></b><b></b><b></b><b></b><b></b></div>
              <div class="song" id="nt-title">Nothing playing</div>
              <div class="who" id="nt-artist">Play a song to load the tape</div>
              <div class="side">A</div>
            </div>
            <div class="reels">
              <svg viewBox="0 0 250 62" aria-hidden="true">
                <defs>
                  <radialGradient id="nt-pack" cx="50%" cy="50%" r="50%">
                    <stop offset="0.55" stop-color="#3a1a1a" /><stop offset="1" stop-color="#1c0b0b" />
                  </radialGradient>
                </defs>
                <line x1="40" y1="5" x2="210" y2="5" stroke="#2a1410" stroke-width="2" id="nt-tape-top" />
                <circle id="nt-pack-l" cx="40" cy="31" r="26" fill="url(#nt-pack)" />
                <circle id="nt-pack-r" cx="210" cy="31" r="16" fill="url(#nt-pack)" />
                <g class="hub"><circle cx="40" cy="31" r="12" fill="#f4e9ff" />
                  <path d="M40 21v6M40 35v6M30 31h6M44 31h6M33 24l4 4M43 34l4 4M33 38l4-4M43 28l4-4" stroke="#1a0636" stroke-width="2.4" stroke-linecap="round" />
                  <circle cx="40" cy="31" r="4" fill="#1a0636" /></g>
                <g class="hub"><circle cx="210" cy="31" r="12" fill="#f4e9ff" />
                  <path d="M210 21v6M210 35v6M200 31h6M214 31h6M203 24l4 4M213 34l4 4M203 38l4-4M213 28l4-4" stroke="#1a0636" stroke-width="2.4" stroke-linecap="round" />
                  <circle cx="210" cy="31" r="4" fill="#1a0636" /></g>
                <rect x="96" y="20" width="58" height="22" rx="4" fill="rgba(41,231,255,0.10)" stroke="rgba(41,231,255,0.45)" />
              </svg>
            </div>
            <div class="foot"><i></i><i></i></div>
            <span class="brand">VHS-90</span>
            <span class="len" id="nt-len">--:--</span>
          </div>
          <div class="deck" id="nt-deck">
            <button type="button" id="nt-prev" aria-label="Previous track"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
            <button type="button" class="big" id="nt-play" aria-label="Play or pause"><svg viewBox="0 0 24 24" id="nt-play-ico"><path d="M8 5v14l11-7z"/></svg></button>
            <button type="button" id="nt-next" aria-label="Next track"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
            <div class="eq" aria-hidden="true" id="nt-eq"></div>
            <span class="time" id="nt-time">--:--</span>
          </div>
        </div></div>
      </article>

      <article class="widget sign dash-w" data-id="neon-dash" data-hooks="battery,network">
        <div class="sign-frame"><div class="sign-body">
          <div class="gauge" role="img" aria-label="Battery" id="nd-gauge">
            <svg viewBox="0 0 236 164" aria-hidden="true">
              <defs>
                <linearGradient id="nd-arc" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0" stop-color="#ff2bd6" /><stop offset="0.55" stop-color="#ff8a3d" /><stop offset="1" stop-color="#ffd23f" />
                </linearGradient>
              </defs>
              <g id="nd-ticks"></g>
              <path d="M30.7 154.2 A96 96 0 1 1 205.3 154.2" fill="none" stroke="rgba(183,155,216,0.18)" stroke-width="12" stroke-linecap="round" pathLength="100" />
              <path id="nd-fill" d="M30.7 154.2 A96 96 0 1 1 205.3 154.2" fill="none" stroke="url(#nd-arc)" stroke-width="12" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100" style="filter: drop-shadow(0 0 6px #ff2bd6)" />
              <text x="4" y="162" fill="#ff4f9a" font-family="Kanit, Arial Black, sans-serif" font-style="italic" font-weight="900" font-size="18">E</text>
              <text x="218" y="162" fill="#ffd23f" font-family="Kanit, Arial Black, sans-serif" font-style="italic" font-weight="900" font-size="18">F</text>
              <g class="needle" id="nd-needle" style="transform: rotate(-125deg)">
                <path d="M118 22 L124 46 L118 52 L112 46 Z" fill="#29e7ff" style="filter: drop-shadow(0 0 6px #29e7ff)" />
              </g>
            </svg>
            <div class="read" id="nd-pct">--<small>%</small></div>
            <div class="unit" id="nd-unit">battery</div>
          </div>
          <div class="sig">
            <div class="bars" id="nd-bars"><b></b><b></b><b></b><b></b><b></b></div>
            <div class="ssid" id="nd-ssid">offline</div>
            <div class="netstate" id="nd-net">looking for a network</div>
          </div>
          <div class="dash-foot"><span id="nd-left">--</span><span class="hot" id="nd-plug">--</span></div>
        </div></div>
      </article>
    </section>

    <!-- ===== Side rail: the open windows, docked on the left edge =====
         Click a window to bring it up, click the one in front to minimize it,
         middle-click to close it. Focused = cyan, asking for attention = pink pulse,
         minimized = dim, taskbar progress = a yellow line. -->
    <template class="spawnable" data-id="neon-rail" data-anchor="left" data-w="72"
              data-hooks="windows,windows-control,spawn,battery">
      <style>
        html.overlay body:has(.rail) { background: #0b0220; }
        .rail {
          position: relative; height: 100%; width: 100%; display: flex; flex-direction: column; align-items: center;
          padding: 16px 0 14px; gap: 10px; overflow: hidden;
          background: linear-gradient(180deg, #07021a 0%, #13042c 55%, #2a0748 100%);
          font-family: var(--font-ui); color: var(--ice);
        }
        .rail::after { /* neon edge */
          content: ""; position: absolute; top: 0; right: 0; bottom: 0; width: 2px;
          background: linear-gradient(180deg, var(--cyan), #8b5cff 50%, var(--magenta));
          box-shadow: 0 0 10px var(--magenta), 0 0 18px rgba(41, 231, 255, 0.6);
        }
        .rail .logo { width: 40px; height: 40px; flex: none; margin-bottom: 10px; filter: drop-shadow(0 0 10px rgba(255, 79, 154, 0.8)); }
        .rail .wins { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; overflow: hidden; }
        .rail .win {
          position: relative; width: 50px; height: 50px; flex: none; border-radius: 14px; display: grid; place-items: center;

    <script>
