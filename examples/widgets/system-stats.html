<!-- Paste into desktop/index.html. Unique data-id="system-stats". Uses versailles.invoke("sys_stats") (not a named hook). -->
<style>
  .sys { width: 260px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .sys-row { display: flex; align-items: center; gap: 10px; }
  .sys-name { font-size: 10.5px; font-weight: 600; color: var(--ink-mut); width: 38px; flex: none; letter-spacing: 0.08em; text-transform: uppercase; }
  .sys-track { flex: 1; height: 5px; border-radius: 99px; background: var(--chip); overflow: hidden; }
  .sys-fill { height: 100%; width: 0; border-radius: 99px; background: var(--ink); transition: width 0.8s ease; }
  .sys-val { font-size: 11.5px; font-weight: 600; width: 38px; text-align: right; font-variant-numeric: tabular-nums; flex: none; }
</style>
<article class="widget sys" data-id="system-stats">
  <div class="sys-row">
    <span class="sys-name">CPU</span>
    <div class="sys-track"><div class="sys-fill" id="sys-cpu"></div></div>
    <span class="sys-val" id="sys-cpu-v">0%</span>
  </div>
  <div class="sys-row">
    <span class="sys-name">RAM</span>
    <div class="sys-track"><div class="sys-fill" id="sys-ram"></div></div>
    <span class="sys-val" id="sys-ram-v">0%</span>
  </div>
  <div class="sys-row">
    <span class="sys-name">Disk</span>
    <div class="sys-track"><div class="sys-fill" id="sys-dsk"></div></div>
    <span class="sys-val" id="sys-dsk-v">0%</span>
  </div>
</article>
<script>
  (function systemStatsWidget() {
    const cpu = document.getElementById('sys-cpu');
    if (!cpu) return;
    const rows = [
      { f: cpu, v: document.getElementById('sys-cpu-v'), key: 'cpu', cur: 23 },
      { f: document.getElementById('sys-ram'), v: document.getElementById('sys-ram-v'), key: 'mem', cur: 61 },
      { f: document.getElementById('sys-dsk'), v: document.getElementById('sys-dsk-v'), key: 'disk', cur: 44 }
    ];
    function render(vals) {
      rows.forEach(function (r) {
        const p = Math.round(Math.min(100, Math.max(0, vals[r.key])));
        r.cur = p;
        r.f.style.width = p + '%';
        r.v.textContent = p + '%';
      });
    }
    function sim() {
      rows.forEach(function (r) { r.cur = Math.min(97, Math.max(4, r.cur + (Math.random() * 22 - 11))); });
      render({ cpu: rows[0].cur, mem: rows[1].cur, disk: rows[2].cur });
    }
    let live = true;
    async function tick() {
      if (live && window.versailles && typeof window.versailles.invoke === 'function') {
        try {
          const s = await window.versailles.invoke('sys_stats');
          if (s && typeof s.cpu === 'number') { render(s); return; }
        } catch (_) { live = false; }
      }
      sim();
    }
    tick();
    setInterval(tick, 2000);
  })();
</script>
