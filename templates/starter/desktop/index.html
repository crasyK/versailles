<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Versailles</title>
    <script type="application/json" id="versailles">
    {
      "autostart": true,
      "snapThreshold": 12,
      "launcher": {

    </script>
    <!--
      Single-file desktop dialect
      .widget              static tile on the canvas
      .spawnable           template; host opens a native always-on-top window
      .action-bar          optional example class on a spawnable
      data-id              catalog id (calc aliases calculator)
      data-w / data-h      overlay size
      data-anchor          c/center/overlay = centered overlay; tr = docked slide-out
      data-hotkey          global accelerator when data-hooks includes hotkey
                           (any spawnable; Alt+Space, Ctrl+Shift+D, CommandOrControl+K)
      data-hooks           allowlist: media, mouse, layout, spawn, shell, hotkey, pty

      Preview: ?m=desktop (default) | widgets | spawn | spawn&id=draw | action_bar
    -->
    <style>
      :root {
        --font-sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", Roboto, sans-serif;
        --font-mono: "Cascadia Mono", "JetBrains Mono", Consolas, monospace;
        --bg: #f4f4f4;
        --canvas: #f4f4f4;
        --paper: #f9fafb;
        --ink: #141414;
        --ink-mut: #6b7280;
        --muted: #6b7280;
        --chip: #e5e7eb;
        --white: #ffffff;
        --dark-card: #131212;
        --stroke: 2px solid #141414;
        --stroke-dashed: 2px dashed #141414;
        --shadow: 0 4px 0 0 #141414;
        --radius-pill: 32px;
        --radius-card: 20px;
        --radius-chip: 9999px;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; }
      body {
        display: flex;
        flex-direction: column;
        font-family: var(--font-sans);
        color: var(--ink);
        background-color: var(--bg);
        background-image:
          linear-gradient(rgba(20, 20, 20, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(20, 20, 20, 0.045) 1px, transparent 1px);
        background-size: 28px 28px;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      html.overlay, html.overlay body {
        width: 100% !important;
        height: 100% !important;
        background: transparent;
        background-image: none;
        overflow: hidden;
      }
      html.overlay:has(.cli), html.overlay:has(.cli) body {
        background: var(--paper);
      }
      /* Transparent WebView2 + <canvas> crashes the GPU process on Windows. */
      html.overlay:has(.draw-pad), html.overlay:has(.draw-pad) body {
        background: var(--paper);
      }
      html.overlay #preview-root,
      html.overlay body.preview #preview-root {
        display: flex !important;
        flex-direction: column;
        width: 100%;
        height: 100%;
        padding: 0;
        overflow: hidden;
      }
      html.overlay .spawn-surface.solo {
        flex: 1;
        min-width: 0;
        min-height: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      html.overlay .spawn-surface.solo > .cli {
        flex: 1;
        min-height: 0;
        width: 100%;
        height: 100%;
      }
      button { font-family: inherit; border: 0; cursor: pointer; background: none; color: inherit; }

      .stage {
        position: relative;
        flex: 1;
        min-height: 0;
        padding: 26px;
        display: flex;
        align-items: flex-start;
        gap: 14px;
      }
      article.widget {
        background: var(--paper);
        border: var(--stroke);
        box-shadow: var(--shadow);
        border-radius: var(--radius-card);
        min-width: 0;
        min-height: 0;
      }

      .clock {
        width: 320px;
        height: 150px;
        padding: 16px 20px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 6px;
      }
      .clock-time {
        font: 600 52px var(--font-sans);
        letter-spacing: -0.03em;
        font-variant-numeric: tabular-nums;
        line-height: 1;
      }
      .clock-time .sec {
        display: inline-block;
        font: 600 12px var(--font-sans);
        font-variant-numeric: tabular-nums;
        color: var(--paper);
        background: var(--ink);
        border-radius: var(--radius-chip);
        padding: 3px 8px;
        margin-left: 8px;
        vertical-align: 8px;
        letter-spacing: 0;
      }
      .clock-date { font-size: 13px; color: var(--ink-mut); }

      #preview-root { display: none; flex: 1; min-height: 0; padding: 26px; gap: 16px; flex-wrap: wrap; align-content: flex-start; overflow: auto; }
      body.preview { overflow: auto; }
      body.preview #preview-root { display: flex; }
      body.preview-widgets #preview-root { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
      .spawn-surface {
        background: var(--paper); border: var(--stroke); box-shadow: var(--shadow);
        border-radius: var(--radius-card); padding: 16px; color: var(--ink);
      }
      .spawn-surface.solo { width: 100%; height: 100%; padding: 0; box-shadow: none; border: 0; background: var(--paper); }
      html.overlay .spawn-surface.solo { box-shadow: var(--shadow); border: var(--stroke); }
      html.overlay .spawn-surface.solo:has(.cli) {
        padding: 0; border: 0; box-shadow: none; background: var(--paper);
        overflow: hidden; border-radius: 18px;
      }
      .unknown-spawn {
        font: 600 12px/1.4 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase;
        color: var(--ink); border: var(--stroke-dashed); border-radius: 16px; padding: 18px;
      }

      .draw-pad { display: flex; flex-direction: column; gap: 10px; height: 100%; min-height: 0; overflow: hidden; cursor: default; }
      .spawn-surface:not(.solo) .draw-pad { width: 448px; height: 328px; }
      .spawn-surface.solo:has(.draw-pad) {
        display: flex; flex-direction: column; padding: 12px; overflow: hidden; min-height: 0;
      }
      .draw-tools { display: flex; flex-wrap: wrap; gap: 8px; flex: none; align-items: center; cursor: grab; }
      .draw-tools button {
        height: 32px; padding: 0 12px; border-radius: var(--radius-pill);
        border: var(--stroke-dashed); background: var(--paper); color: var(--ink);
        font: 600 11px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase;
        cursor: pointer;
      }
      .draw-tools button:hover { background: var(--chip); }
      .draw-tools button.on { background: #141414; color: #f9fafb; border-style: solid; }
      .draw-colors { display: inline-flex; gap: 6px; align-items: center; }
      .draw-colors .swatch {
        width: 18px; height: 18px; padding: 0; border-radius: 50%;
        border: 2px solid var(--ink); background: var(--c); cursor: pointer;
      }
      .draw-colors .swatch.on { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--ink); }
      .draw-tools .draw-close { margin-left: auto; width: 32px; padding: 0; font-size: 14px; border-style: solid; }
      .draw-tools .draw-close:hover { background: var(--ink); color: var(--paper); }
      .draw-board-wrap {
        flex: 1; min-height: 0; border: var(--stroke); border-radius: 12px;
        background: #15161a; overflow: hidden; position: relative; cursor: crosshair;
      }
      .draw-board-wrap svg { display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: none; pointer-events: none; }

      .cli {
        width: 100%; height: 100%; overflow: hidden; background: var(--paper);
        box-shadow: inset 0 0 0 2px #141414, 0 4px 0 0 #141414;
        border-radius: 18px; font-size: 13px; display: flex; flex-direction: column;
      }
      .cli-head {
        display: flex; align-items: center; gap: 10px; padding: 12px 18px 8px;
        color: var(--ink-mut); font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; flex: none;
      }
      .cli-head i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink); flex: none; }
      .cli-head .pid { margin-left: auto; }
      .cli-action { flex: 1; min-height: 0; display: flex; flex-direction: column; }
      .cli[data-mode="terminal"] .cli-action { display: none; }
      .cli-line {
        position: relative; display: flex; align-items: center; gap: 10px;
        margin: 4px 16px 8px; padding: 10px 16px; align-self: stretch;
        background: var(--white); border-radius: var(--radius-pill);
        box-shadow: inset 0 0 0 2px #141414; flex: none;
        font-family: var(--font-mono); font-size: 12.5px;
      }
      .cli-ps {
        color: var(--ink-mut); font-weight: 600; white-space: nowrap;
        overflow: hidden; text-overflow: ellipsis; max-width: 52%; flex: none;
      }
      .cli-typed { display: inline-flex; align-items: center; min-width: 0; }
      .cli-echo { color: var(--ink); white-space: pre; }
      .cli-caret {
        width: 7px; height: 16px; flex: none; margin-left: 2px; border-radius: 1px;
        background: var(--ink); animation: lnblink 1.2s ease-in-out infinite;
      }
      @keyframes lnblink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      .cli-in {
        position: absolute; inset: 0; width: 100%; opacity: 0;
        font: inherit; border: 0; outline: none; background: none; cursor: text;
      }
      .cli-res {
        display: none; margin: 0 16px 6px; padding: 10px 16px; line-height: 1.55;
        background: var(--white); border-radius: 16px; box-shadow: inset 0 0 0 2px #141414;
        white-space: pre-wrap; word-break: break-word; flex: none; color: var(--ink); font-size: 13px;
      }
      .cli-res.on { display: block; }
      .cli-res .link { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
      .cli-sug {
        padding: 4px 12px 8px; display: flex; flex-direction: column; gap: 4px;
        flex: 1; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--chip) transparent;
      }
      .cli-sug::-webkit-scrollbar { width: 8px; }
      .cli-sug::-webkit-scrollbar-thumb { background: var(--chip); border-radius: 9999px; }
      .cl-s {
        display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
        padding: 8px 14px; border-radius: 16px; cursor: pointer; flex: none; background: var(--paper);
      }
      .cl-s b { color: var(--ink); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .cl-s span {
        color: var(--ink-mut); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        flex: none; max-width: 48%; font-size: 11.5px;
      }
      .cl-s:hover { background: var(--chip); box-shadow: inset 0 0 0 2px #141414; }
      .cl-s.on, .cl-s.on:hover { background: var(--ink); box-shadow: none; color: var(--paper); }
      .cl-s:hover b { color: var(--ink); }
      .cl-s.on b, .cl-s.on:hover b { color: var(--paper); }
      .cl-s:hover span { color: var(--ink-mut); }
      .cl-s.on span, .cl-s.on:hover span { color: var(--paper); }
      .cli-term-wrap {
        display: none; flex: 1; min-height: 0; margin: 4px 14px 10px; position: relative;
        background: var(--dark-card); border-radius: 16px; box-shadow: inset 0 0 0 2px #141414; overflow: hidden;
      }
      .cli[data-mode="terminal"] .cli-term-wrap { display: flex; flex-direction: column; }
      .cli-term-wrap[hidden] { display: none !important; }
      .cli-term { flex: 1; min-height: 0; width: 100%; padding: 8px 12px 6px; background: var(--dark-card); color-scheme: dark; touch-action: pan-y; overscroll-behavior: contain; }
      .cli-term .xterm { width: 100%; height: 100%; }
      .cli-term .xterm-viewport {
        overflow-y: scroll !important; background: transparent !important;
        scrollbar-width: thin; scrollbar-color: #3f3f3f transparent;
      }
      .cli-term .xterm-viewport::-webkit-scrollbar { width: 8px; }
      .cli-term .xterm-viewport::-webkit-scrollbar-button { display: none; width: 0; height: 0; }
      .cli-term .xterm-viewport::-webkit-scrollbar-track { background: transparent; }
      .cli-term .xterm-viewport::-webkit-scrollbar-thumb { background: #3f3f3f; border-radius: 9999px; }
      .cli-term .xterm-screen { padding-right: 4px; }
      .cli-term-find {
        position: absolute; top: 10px; right: 12px; z-index: 6;
        display: none; align-items: center; gap: 6px;
        padding: 6px 8px 6px 10px;
        background: var(--paper); color: var(--ink);
        border: 2px solid #141414; border-radius: 16px;
        box-shadow: 0 4px 0 0 #141414;
      }
      .cli-term-find.on { display: flex; }
      .cli-term-find input {
        width: 160px; border: 0; outline: none; background: transparent;
        font: 600 12px/1 var(--font-sans); color: var(--ink);
      }
      .cli-term-find button {
        height: 26px; min-width: 26px; padding: 0 8px;
        border: 2px dashed #141414; border-radius: 9999px;
        background: var(--paper); color: var(--ink);
        font: 600 11px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase;
        cursor: pointer;
      }
      .cli-term-find button.on,
      .cli-term-find button:active {
        background: var(--ink); color: var(--paper); border-style: solid;
      }
      .cli-term-menu {
        position: fixed; z-index: 20; display: none; flex-direction: column;
        min-width: 148px; padding: 6px;
        background: var(--paper); color: var(--ink);
        border: 2px solid #141414; border-radius: 16px;
        box-shadow: 0 4px 0 0 #141414;
      }
      .cli-term-menu.on { display: flex; }
      .cli-term-menu button {
        text-align: left; padding: 8px 12px; border: 0; background: transparent;
        color: var(--ink); border-radius: 12px; cursor: pointer;
        font: 600 11px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase;
      }
      .cli-term-menu button:hover { background: var(--chip); }
      .cli-term-menu button:disabled { opacity: 0.35; cursor: default; }
      .cli-foot {
        display: flex; gap: 14px; padding: 8px 18px 12px;
        font: 600 11px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-mut); flex: none;
      }
      .cli-foot .r { margin-left: auto; }
      body.preview-action { padding: 0; }
      body.preview-action #preview-root { padding: 0; display: block; }
      body.preview-action .spawn-surface { height: 100%; padding: 0; border: 0; box-shadow: none; background: var(--paper); }
    </style>
  </head>
  <body>
    <section id="desktop" class="stage">
      <article class="widget clock" data-id="clock">
        <div class="clock-time"><span id="clk">--:--</span><span class="sec" id="clk-sec">--</span></div>
        <div class="clock-date" id="clk-date"></div>
      </article>
    </section>

    <template class="spawnable" data-id="draw" data-w="480" data-h="360" data-anchor="tr" data-hooks="layout,spawn">
      <div class="draw-pad">
        <div class="draw-tools" data-no-drag>
          <button type="button" class="on" data-tool="pen">Pen</button>
          <button type="button" data-tool="highlighter">Highlight</button>
          <button type="button" data-tool="eraser">Eraser</button>
          <span class="draw-colors">
            <button type="button" class="swatch on" data-color="#f9fafb" style="--c:#f9fafb" title="White"></button>
            <button type="button" class="swatch" data-color="#ffd60a" style="--c:#ffd60a" title="Yellow"></button>
            <button type="button" class="swatch" data-color="#ff6b62" style="--c:#ff6b62" title="Red"></button>
            <button type="button" class="swatch" data-color="#64d2ff" style="--c:#64d2ff" title="Blue"></button>
            <button type="button" class="swatch" data-color="#30d158" style="--c:#30d158" title="Green"></button>
          </span>
          <button type="button" data-action="clear">Clear</button>
          <button type="button" class="draw-close" data-action="close" title="Close">&times;</button>
        </div>
        <div class="draw-board-wrap" data-no-drag id="draw-board-wrap"></div>
      </div>
      <script>
        (function () {
          var script = document.currentScript;
          var root = (script && script.closest('.spawn-surface')) ||
            document.querySelector('.spawn-surface[data-id="draw"]');
          if (!root) return;
          var KEY = 'deck-draw-svg-v2';
          var BOARD = '#15161a';
          var wrap = root.querySelector('#draw-board-wrap');
          var tools = root.querySelector('.draw-tools');
          if (!wrap || !tools) return;
          var NS = 'http://www.w3.org/2000/svg';
          var svg = document.createElementNS(NS, 'svg');
          svg.setAttribute('width', '100%');
          svg.setAttribute('height', '100%');
          wrap.appendChild(svg);
          var tool = 'pen', color = '#f9fafb', drawing = false, line = null, saveTimer = null;

          function styleFor(el) {
            var stroke = color, width = 3, opacity = 1;
            if (tool === 'highlighter') { width = 16; opacity = 0.35; }
            else if (tool === 'eraser') { stroke = BOARD; width = 24; }
            el.setAttribute('stroke', stroke);
            el.setAttribute('stroke-width', String(width));
            el.setAttribute('stroke-opacity', String(opacity));
            el.setAttribute('fill', 'none');
            el.setAttribute('stroke-linecap', 'round');
            el.setAttribute('stroke-linejoin', 'round');
          }

          function pos(e) {
            var r = wrap.getBoundingClientRect();
            return { x: e.clientX - r.left, y: e.clientY - r.top };
          }

          function persist() {
            clearTimeout(saveTimer);
            saveTimer = setTimeout(function () {
              try { localStorage.setItem(KEY, svg.innerHTML); } catch (_) {}
            }, 300);
          }

          try {
            var saved = localStorage.getItem(KEY);
            if (saved) svg.innerHTML = saved;
          } catch (_) {}

          function markOn(selector, btn) {
            tools.querySelectorAll(selector).forEach(function (b) {
              b.classList.toggle('on', b === btn);
            });
          }

          tools.addEventListener('click', function (e) {
            var btn = e.target && e.target.closest ? e.target.closest('button') : null;
            if (!btn) return;
            var t = btn.getAttribute('data-tool');
            var c = btn.getAttribute('data-color');
            var a = btn.getAttribute('data-action');
            if (t) {
              tool = t;
              markOn('[data-tool]', btn);
            } else if (c) {
              color = c;
              markOn('[data-color]', btn);
              if (tool === 'eraser') {
                tool = 'pen';
                var pen = tools.querySelector('[data-tool="pen"]');
                if (pen) markOn('[data-tool]', pen);
              }
            } else if (a === 'clear') {
              svg.innerHTML = '';
              try { localStorage.removeItem(KEY); } catch (_) {}
            } else if (a === 'close') {
              try {
                var v = window.versailles || window.deck;
                if (v && v.closeWidget) v.closeWidget();
              } catch (_) {}
            }
          });

          wrap.addEventListener('pointerdown', function (e) {
            if (e.button !== 0) return;
            e.preventDefault();
            drawing = true;
            try { wrap.setPointerCapture(e.pointerId); } catch (_) {}
            var p = pos(e);
            line = document.createElementNS(NS, 'polyline');
            styleFor(line);
            line.setAttribute('points', p.x + ',' + p.y);
            svg.appendChild(line);
          });
          wrap.addEventListener('pointermove', function (e) {
            if (!drawing || !line) return;
            var p = pos(e);
            line.setAttribute('points', line.getAttribute('points') + ' ' + p.x + ',' + p.y);
          });
          function endStroke() {
            if (!drawing) return;
            drawing = false;
            line = null;
            persist();
          }
          wrap.addEventListener('pointerup', endStroke);
          wrap.addEventListener('pointercancel', endStroke);
        })();
      </script>
    </template>

    <template class="spawnable action-bar"
              data-id="action-bar"
              data-hooks="shell,hotkey,pty"
              data-hotkey="Alt+Space"
              data-anchor="c"
              data-w="640"
              data-h="420">
      <div class="cli" id="cli-root" data-mode="action" data-search-hf="https://huggingface.co/models?search={q}">
        <div class="cli-head">
          <i></i><span id="cli-title">versailles actions · pwsh</span>
          <span class="pid" id="cli-mode-label">actions</span>
        </div>
        <div class="cli-action" id="cli-action">
          <div class="cli-line">
            <span class="cli-ps" id="cli-ps">PS …&gt;</span>
            <span class="cli-typed">
              <span class="cli-echo" id="cli-echo"></span><span class="cli-caret"></span>
            </span>
            <input class="cli-in" id="cli-in" spellcheck="false" autocomplete="off" autofocus aria-label="command input" />
          </div>
          <div class="cli-res" id="cli-res"></div>
          <div class="cli-sug" id="cli-sug"></div>
        </div>
        <div class="cli-term-wrap" id="cli-term-wrap" hidden>
          <div class="cli-term" id="cli-term"></div>
        </div>
        <div class="cli-foot" id="cli-foot">
          <span id="cli-foot-l">enter</span><span id="cli-foot-m">tab</span><span id="cli-foot-r-hint">esc</span>
          <span class="r" id="cli-foot-r">? web · !! term · help</span>
        </div>
      </div>
      <script>
        (function loadBar() {
          var sdk = location.protocol === 'file:' ? '../.sdk/' : '/files/.sdk/';
          var desk = location.protocol === 'file:' ? '' : '/files/desktop/';
          if (!document.querySelector('link[data-xterm]')) {
            var css = document.createElement('link');
            css.rel = 'stylesheet';
            css.href = sdk + 'xterm.css';
            css.setAttribute('data-xterm', '1');
            document.head.appendChild(css);
          }
          function load(src) {
            return new Promise(function (resolve, reject) {
              var s = document.createElement('script');
              s.src = src;
              s.onload = resolve;
              s.onerror = reject;
              document.head.appendChild(s);
            });
          }
          var chain = Promise.resolve();
          if (!(window.versailles && typeof window.versailles.listen === 'function')) {
            chain = chain.then(function () { return load(sdk + 'versailles.js'); });
          }
          if (!window.Terminal) chain = chain.then(function () { return load(sdk + 'xterm.js'); });
          if (!window.FitAddon) chain = chain.then(function () { return load(sdk + 'xterm-addon-fit.js'); });
          if (!window.WebglAddon) chain = chain.then(function () { return load(sdk + 'xterm-addon-webgl.js').catch(function () {}); });
          if (!window.WebLinksAddon) chain = chain.then(function () { return load(sdk + 'xterm-addon-web-links.js').catch(function () {}); });
          if (!window.SearchAddon) chain = chain.then(function () { return load(sdk + 'xterm-addon-search.js').catch(function () {}); });
          chain.then(function () { return load(desk + 'bar.js?v=' + Date.now()); }).catch(function (err) {
            console.error('bar engine failed to load', err);
          });
        })();
      </script>
    </template>

    <div id="preview-root" hidden></div>

    <script>
      (function boot() {
        const params = new URLSearchParams(location.search || '');
        let m = (params.get('m') || 'desktop').trim().toLowerCase().replace(/-/g, '_');
        if (m === 'spawnables') m = 'spawn';
        if (m === 'actionbar') m = 'action_bar';
        const idRaw = (params.get('id') || '').trim();
        const id = idRaw === 'calc' ? 'calculator' : idRaw;
        document.documentElement.dataset.mode = m;
        document.body.dataset.mode = m;
        if (id) document.body.dataset.spawnId = id;

        const desktop = document.getElementById('desktop');
        const preview = document.getElementById('preview-root');

        function runScripts(root) {
          root.querySelectorAll('script').forEach(function (old) {
            const s = document.createElement('script');
            Array.prototype.slice.call(old.attributes || []).forEach(function (a) {
              s.setAttribute(a.name, a.value);
            });
            s.textContent = old.textContent;
            old.replaceWith(s);
          });
        }

        function materialize(tpl, solo) {
          const wrap = document.createElement('section');
          wrap.className = 'spawn-surface' + (solo ? ' solo' : '');
          wrap.dataset.id = tpl.getAttribute('data-id') || '';
          const hooks = tpl.getAttribute('data-hooks');
          if (hooks) wrap.setAttribute('data-hooks', hooks);
          wrap.appendChild(tpl.content.cloneNode(true));
          return wrap;
        }

        function mountSpawn(tpl, solo, parent) {
          const wrap = materialize(tpl, solo);
          parent.appendChild(wrap);
          runScripts(wrap);
          return wrap;
        }

        function spawnables(includeBar) {
          return Array.prototype.slice.call(document.querySelectorAll('template.spawnable')).filter(function (t) {
            return includeBar || !t.classList.contains('action-bar');
          });
        }

        function findSpawn(needle) {
          const want = (needle || '').toLowerCase();
          return spawnables(true).find(function (t) {
            const sid = (t.getAttribute('data-id') || '').toLowerCase();
            return sid === want || (want === 'calc' && sid === 'calculator') || (want === 'calculator' && sid === 'calc');
          });
        }

        if (m === 'desktop') return;

        desktop.hidden = true;
        preview.hidden = false;
        document.body.classList.add('preview');

        if (m === 'widgets') {
          document.body.classList.add('preview-widgets');
          Array.prototype.slice.call(desktop.querySelectorAll('article.widget')).forEach(function (el) {
            preview.appendChild(el);
          });
          return;
        }

        desktop.remove();

        if (m === 'action_bar') {
          document.body.classList.add('preview-action');
          const tpl = document.querySelector('template.action-bar, template.spawnable[data-id="action-bar"]');
          if (tpl) mountSpawn(tpl, true, preview);
          return;
        }

        if (m === 'spawn') {
          if (id) {
            document.documentElement.classList.add('overlay');
            const tpl = findSpawn(id);
            if (!tpl) {
              const p = document.createElement('p');
              p.className = 'unknown-spawn';
              p.textContent = 'unknown spawnable: ' + id;
              preview.appendChild(p);
              return;
            }
            const hosted = !!(window.__TAURI_INTERNALS__ || window.__TAURI__);
            if (!hosted) {
              const w = tpl.getAttribute('data-w');
              const h = tpl.getAttribute('data-h');
              if (w) document.body.style.width = w + 'px';
              if (h) document.body.style.height = h + 'px';
            }
            preview.style.padding = '0';
            mountSpawn(tpl, true, preview);
            return;
          }
          spawnables(false).forEach(function (t) { mountSpawn(t, false, preview); });
          return;
        }

        const p = document.createElement('p');
        p.className = 'unknown-spawn';
        p.textContent = 'unknown mode: ' + m;
        preview.appendChild(p);
      })();
    </script>
    <script>
      (function loadSdk() {
        if (window.versailles && typeof window.versailles.invoke === 'function') return;
        var s = document.createElement('script');
        s.src = location.protocol === 'file:' ? '../.sdk/versailles.js' : '/files/.sdk/versailles.js';
        document.head.appendChild(s);
      })();
    </script>
    <script>
      (function clockWidget() {
        const t = document.getElementById('clk');
        const s = document.getElementById('clk-sec');
        const d = document.getElementById('clk-date');
        if (!t) return;
        const pad = function (n) { return String(n).padStart(2, '0'); };
        function tick() {
          const n = new Date();
          t.textContent = pad(n.getHours()) + ':' + pad(n.getMinutes());
          s.textContent = pad(n.getSeconds());
          d.textContent = n.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
        }
        tick();
        setInterval(tick, 1000);
      })();
    </script>
  </body>
