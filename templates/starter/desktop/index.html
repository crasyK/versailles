<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Versailles</title>
    <script type="application/json" id="versailles">

    <!--
      Single-file desktop dialect
      .widget              static tile on the canvas
      .spawnable           template; host opens a native always-on-top window
      .action-bar          optional example class on a spawnable
      data-id              catalog id (calc aliases calculator)
      data-w / data-h      overlay size
      data-anchor          c/center/overlay = centered overlay; tr = docked slide-out
      data-hotkey          global accelerator when data-hooks includes hotkey
      data-hooks           allowlist: media, mouse, layout, spawn, shell, hotkey, pty

      Preview: ?m=desktop (default) | widgets | spawn | spawn&id=draw | action_bar
    -->
    <style>
      :root {
        --font-sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", Roboto, sans-serif;
        --font-mono: "Cascadia Mono", "JetBrains Mono", Consolas, monospace;
        --bg: #f4f4f4;
        --canvas: #f4f4f4;
        --paper: #f9fafb;
        --ink: #141414;
        --ink-mut: #6b7280;
        --muted: #6b7280;
        --chip: #e5e7eb;
        --white: #ffffff;
        --dark-card: #131212;
        --stroke: 2px solid #141414;
        --stroke-dashed: 2px dashed #141414;
        --shadow: 0 4px 0 0 #141414;
        --radius-pill: 32px;
        --radius-card: 20px;
        --radius-chip: 9999px;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; }
      body {
        display: flex;
        flex-direction: column;
        font-family: var(--font-sans);
        color: var(--ink);
        background-color: var(--bg);
        background-image:
          linear-gradient(rgba(20, 20, 20, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(20, 20, 20, 0.045) 1px, transparent 1px);
        background-size: 28px 28px;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      html.overlay, html.overlay body {
        background: transparent;
        background-image: none;
        overflow: hidden;
      }
      button { font-family: inherit; border: 0; cursor: pointer; background: none; color: inherit; }

      .stage {
        position: relative;
        flex: 1;
        min-height: 0;
        padding: 26px;
        display: flex;
        align-items: flex-start;
        gap: 14px;
      }
      article.widget {
        background: var(--paper);
        border: var(--stroke);
        box-shadow: var(--shadow);
        border-radius: var(--radius-card);
        min-width: 0;
        min-height: 0;
      }

      .clock {
        width: 320px;
        height: 150px;
        padding: 16px 20px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 6px;
      }
      .clock-time {
        font: 600 52px var(--font-sans);
        letter-spacing: -0.03em;
        font-variant-numeric: tabular-nums;
        line-height: 1;
      }
      .clock-time .sec {
        display: inline-block;
        font: 600 12px var(--font-sans);
        font-variant-numeric: tabular-nums;
        color: var(--paper);
        background: var(--ink);
        border-radius: var(--radius-chip);
        padding: 3px 8px;
        margin-left: 8px;
        vertical-align: 8px;
        letter-spacing: 0;
      }
      .clock-date { font-size: 13px; color: var(--ink-mut); }

      #preview-root { display: none; flex: 1; min-height: 0; padding: 26px; gap: 16px; flex-wrap: wrap; align-content: flex-start; overflow: auto; }
      body.preview { overflow: auto; }
      body.preview #preview-root { display: flex; }
      body.preview-widgets #preview-root { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
      .spawn-surface {
        background: var(--paper); border: var(--stroke); box-shadow: var(--shadow);
        border-radius: var(--radius-card); padding: 16px; color: var(--ink);
      }
      .spawn-surface.solo { width: 100%; height: 100%; box-shadow: none; border: 0; background: var(--paper); }
      html.overlay .spawn-surface.solo { box-shadow: var(--shadow); border: var(--stroke); }
      html.overlay .spawn-surface.solo:has(.cli) {
        padding: 0; border: 0; box-shadow: none; background: transparent;
      }
      .unknown-spawn {
        font: 600 12px/1.4 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase;
        color: var(--ink); border: var(--stroke-dashed); border-radius: 16px; padding: 18px;
      }

      .draw-pad { display: flex; flex-direction: column; gap: 10px; height: 100%; min-height: 240px; }
      .spawn-surface:not(.solo) .draw-pad { width: 448px; height: 328px; }
      .spawn-surface.solo:has(.draw-pad) { display: flex; flex-direction: column; }
      .draw-tools { display: flex; flex-wrap: wrap; gap: 8px; flex: none; }
      .draw-tools button {
        height: 32px; padding: 0 12px; border-radius: var(--radius-pill);
        border: var(--stroke-dashed); background: var(--paper); color: var(--ink);
        font: 600 11px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase;
      }
      .draw-tools button:hover { background: var(--chip); }
      .draw-tools button.on { background: #141414; color: #f9fafb; border-style: solid; }
      .draw-board-wrap {
        flex: 1; min-height: 0; border: var(--stroke); border-radius: 12px;
        background: var(--white); overflow: hidden; position: relative;
      }
      .draw-board-wrap canvas { display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }

      .cli {
        width: 100%; height: 100%; overflow: hidden; background: var(--paper);
        box-shadow: inset 0 0 0 2px #141414, 0 4px 0 0 #141414;
        border-radius: 18px; font-size: 13px; display: flex; flex-direction: column;
      }
      .cli-head {
        display: flex; align-items: center; gap: 10px; padding: 12px 18px 8px;
        color: var(--ink-mut); font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; flex: none;
      }
      .cli-head i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink); flex: none; }
      .cli-head .pid { margin-left: auto; }
      .cli-action { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 18px; }
      .cli-line { display: flex; align-items: baseline; gap: 10px; position: relative; }
      .cli-ps { font-family: var(--font-mono); color: var(--ink-mut); flex: none; }
      .cli-in {
        position: absolute; inset: 0; opacity: 0; border: 0; outline: none;
        font: inherit; font-family: var(--font-mono); color: var(--ink); background: transparent;
      }
      .cli-typed { font-family: var(--font-mono); min-height: 1.2em; }
      .cli-caret { display: inline-block; width: 7px; height: 1em; background: #141414; vertical-align: text-bottom; margin-left: 1px; }
      .cli-res, .cli-sug { margin-top: 10px; font-size: 12.5px; color: var(--ink); }
      .cli-term-wrap { flex: 1; min-height: 0; margin: 0 10px 8px; border-radius: 12px; background: var(--dark-card); overflow: hidden; }
      .cli-term { width: 100%; height: 100%; }
      .cli-foot {
        display: flex; gap: 14px; padding: 8px 18px 12px;
        font: 600 11px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-mut); flex: none;
      }
      .cli-foot .r { margin-left: auto; }
      body.preview-action { padding: 0; }
      body.preview-action #preview-root { padding: 0; display: block; }
      body.preview-action .spawn-surface { height: 100%; padding: 0; border: 0; box-shadow: none; background: transparent; }
    </style>
  </head>
  <body>
    <section id="desktop" class="stage">
      <article class="widget clock" data-id="clock">
        <div class="clock-time"><span id="clk">--:--</span><span class="sec" id="clk-sec">--</span></div>
        <div class="clock-date" id="clk-date"></div>
      </article>
    </section>

    <template class="spawnable" data-id="draw" data-w="480" data-h="360" data-anchor="tr" data-hooks="layout">
      <div class="draw-pad">
        <div class="draw-tools" data-no-drag>
          <button type="button" class="on" data-tool="pen">Pen</button>
          <button type="button" data-tool="highlighter">Highlight</button>
          <button type="button" data-tool="eraser">Eraser</button>
          <button type="button" data-action="clear">Clear</button>
        </div>
        <div class="draw-board-wrap" data-no-drag>
          <canvas id="draw-board"></canvas>
        </div>
      </div>
      <script>
        (function () {
          const root = document.querySelector('.spawn-surface[data-id="draw"]');
          if (!root) return;
          const KEY = 'deck-draw';
          const board = root.querySelector('#draw-board');
          const ctx = board.getContext('2d');
          const wrap = board.parentElement;
          const tools = root.querySelector('.draw-tools');
          let tool = 'pen';
          let drawing = false;
          let lastX = 0;
          let lastY = 0;
          let saveTimer = null;

          function dpr() { return window.devicePixelRatio || 1; }
          function stroke() {
            if (tool === 'pen') {
              ctx.globalCompositeOperation = 'source-over';
              ctx.strokeStyle = '#141414';
              ctx.lineWidth = 2.5;
              ctx.globalAlpha = 1;
            } else if (tool === 'highlighter') {
              ctx.globalCompositeOperation = 'source-over';
              ctx.strokeStyle = '#141414';
              ctx.lineWidth = 16;
              ctx.globalAlpha = 0.16;
            } else {
              ctx.globalCompositeOperation = 'destination-out';
              ctx.lineWidth = 22;
              ctx.globalAlpha = 1;
            }
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
          }
          function fit(keep) {
            const w = Math.max(1, wrap.clientWidth);
            const h = Math.max(1, wrap.clientHeight);
            const scale = dpr();
            let prev = null;
            if (keep && board.width && board.height) {
              prev = document.createElement('canvas');
              prev.width = board.width;
              prev.height = board.height;
              prev.getContext('2d').drawImage(board, 0, 0);
            }
            board.width = Math.floor(w * scale);
            board.height = Math.floor(h * scale);
            board.style.width = w + 'px';
            board.style.height = h + 'px';
            ctx.setTransform(scale, 0, 0, scale, 0, 0);
            if (prev) ctx.drawImage(prev, 0, 0, w, h);
          }
          function persist() {
            clearTimeout(saveTimer);
            saveTimer = setTimeout(function () {
              try { localStorage.setItem(KEY, board.toDataURL('image/png')); } catch (_) {}
            }, 300);
          }
          function restore() {
            let saved = null;
            try { saved = localStorage.getItem(KEY); } catch (_) {}
            if (!saved) return;
            const img = new Image();
            img.onload = function () {
              ctx.globalCompositeOperation = 'source-over';
              ctx.globalAlpha = 1;
              ctx.drawImage(img, 0, 0, wrap.clientWidth, wrap.clientHeight);
            };
            img.src = saved;
          }
          tools.querySelectorAll('[data-tool]').forEach(function (btn) {
            btn.onclick = function () {
              tool = btn.getAttribute('data-tool');
              tools.querySelectorAll('[data-tool]').forEach(function (b) {
                b.classList.toggle('on', b === btn);
              });
            };
          });
          tools.querySelector('[data-action="clear"]').onclick = function () {
            ctx.save();
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, board.width, board.height);
            ctx.restore();
            try { localStorage.removeItem(KEY); } catch (_) {}
          };
          function pos(e) {
            const r = board.getBoundingClientRect();
            return { x: e.clientX - r.left, y: e.clientY - r.top };
          }
          board.addEventListener('pointerdown', function (e) {
            drawing = true;
            board.setPointerCapture(e.pointerId);
            const p = pos(e);
            lastX = p.x;
            lastY = p.y;
          });
          board.addEventListener('pointerup', function () { drawing = false; persist(); });
          board.addEventListener('pointercancel', function () { drawing = false; persist(); });
          board.addEventListener('pointermove', function (e) {
            if (!drawing) return;
            const p = pos(e);
            stroke();
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
            lastX = p.x;
            lastY = p.y;
          });
          fit(false);
          restore();
          if (window.ResizeObserver) {
            new ResizeObserver(function () { fit(true); }).observe(wrap);
          }
        })();
      </script>
    </template>

    <template class="spawnable action-bar"
              data-id="action-bar"
              data-hooks="shell,hotkey,pty"
              data-hotkey="Alt+Space"
              data-anchor="c"
              data-w="640"
              data-h="420">
      <div class="cli" id="cli-root" data-mode="action" data-search-hf="https://huggingface.co/models?search={q}">
        <div class="cli-head">
          <i></i><span id="cli-title">versailles actions · pwsh</span>
          <span class="pid" id="cli-mode-label">actions</span>
        </div>
        <div class="cli-action" id="cli-action">
          <div class="cli-line">
            <span class="cli-ps" id="cli-ps">PS …&gt;</span>
            <span class="cli-typed">
              <span class="cli-echo" id="cli-echo"></span><span class="cli-caret"></span>
            </span>
            <input class="cli-in" id="cli-in" spellcheck="false" autocomplete="off" aria-label="command input" />
          </div>
          <div class="cli-res" id="cli-res"></div>
          <div class="cli-sug" id="cli-sug"></div>
        </div>
        <div class="cli-term-wrap" id="cli-term-wrap" hidden>
          <div class="cli-term" id="cli-term"></div>
        </div>
        <div class="cli-foot" id="cli-foot">
          <span id="cli-foot-l">enter run</span><span id="cli-foot-m">↑↓ history</span><span id="cli-foot-r-hint">tab complete</span>
          <span class="r" id="cli-foot-r">! pwsh · !! term · ? help</span>
        </div>
      </div>
      <script>
        (function loadBar() {
          var sdk = location.protocol === 'file:' ? '../.sdk/' : '/files/.sdk/';
          var desk = location.protocol === 'file:' ? '' : '/files/desktop/';
          if (!document.querySelector('link[data-xterm]')) {
            var css = document.createElement('link');
            css.rel = 'stylesheet';
            css.href = sdk + 'xterm.css';
            css.setAttribute('data-xterm', '1');
            document.head.appendChild(css);
          }
          function load(src) {
            return new Promise(function (resolve, reject) {
              var s = document.createElement('script');
              s.src = src;
              s.onload = resolve;
              s.onerror = reject;
              document.head.appendChild(s);
            });
          }
          var chain = Promise.resolve();
          if (!window.Terminal) chain = chain.then(function () { return load(sdk + 'xterm.js'); });
          if (!window.FitAddon) chain = chain.then(function () { return load(sdk + 'xterm-addon-fit.js'); });
          chain.then(function () { return load(desk + 'bar.js'); }).catch(function (err) {
            console.error('bar engine failed to load', err);
          });
        })();
      </script>
    </template>

    <div id="preview-root" hidden></div>

    <script>
      (function boot() {
        const params = new URLSearchParams(location.search || '');
        let m = (params.get('m') || 'desktop').trim().toLowerCase().replace(/-/g, '_');
        if (m === 'spawnables') m = 'spawn';
        if (m === 'actionbar') m = 'action_bar';
        const idRaw = (params.get('id') || '').trim();
        const id = idRaw === 'calc' ? 'calculator' : idRaw;
        document.documentElement.dataset.mode = m;
        document.body.dataset.mode = m;
        if (id) document.body.dataset.spawnId = id;

        const desktop = document.getElementById('desktop');
        const preview = document.getElementById('preview-root');

        function runScripts(root) {
          root.querySelectorAll('script').forEach(function (old) {
            const s = document.createElement('script');
            Array.prototype.slice.call(old.attributes || []).forEach(function (a) {
              s.setAttribute(a.name, a.value);
            });
            s.textContent = old.textContent;
            old.replaceWith(s);
          });
        }

        function materialize(tpl, solo) {
          const wrap = document.createElement('section');
          wrap.className = 'spawn-surface' + (solo ? ' solo' : '');
          wrap.dataset.id = tpl.getAttribute('data-id') || '';
          const hooks = tpl.getAttribute('data-hooks');
          if (hooks) wrap.setAttribute('data-hooks', hooks);
          wrap.appendChild(tpl.content.cloneNode(true));
          runScripts(wrap);
          return wrap;
        }

        function spawnables(includeBar) {
          return Array.prototype.slice.call(document.querySelectorAll('template.spawnable')).filter(function (t) {
            return includeBar || !t.classList.contains('action-bar');
          });
        }

        function findSpawn(needle) {
          const want = (needle || '').toLowerCase();
          return spawnables(true).find(function (t) {
            const sid = (t.getAttribute('data-id') || '').toLowerCase();
            return sid === want || (want === 'calc' && sid === 'calculator') || (want === 'calculator' && sid === 'calc');
          });
        }

        if (m === 'desktop') return;

        desktop.hidden = true;
        preview.hidden = false;
        document.body.classList.add('preview');

        if (m === 'widgets') {
          document.body.classList.add('preview-widgets');
          Array.prototype.slice.call(desktop.querySelectorAll('article.widget')).forEach(function (el) {
            preview.appendChild(el);
          });
          return;
        }

        desktop.remove();

        if (m === 'action_bar') {
          document.body.classList.add('preview-action');
          const tpl = document.querySelector('template.action-bar, template.spawnable[data-id="action-bar"]');
          if (tpl) preview.appendChild(materialize(tpl, true));
          return;
        }

        if (m === 'spawn') {
          if (id) {
            document.documentElement.classList.add('overlay');
            const tpl = findSpawn(id);
            if (!tpl) {
              const p = document.createElement('p');
              p.className = 'unknown-spawn';
              p.textContent = 'unknown spawnable: ' + id;
              preview.appendChild(p);
              return;
            }
            const w = tpl.getAttribute('data-w');
            const h = tpl.getAttribute('data-h');
            if (w) document.body.style.width = w + 'px';
            if (h) document.body.style.height = h + 'px';
            preview.style.padding = '0';
            preview.appendChild(materialize(tpl, true));
            return;
          }
          spawnables(false).forEach(function (t) { preview.appendChild(materialize(t, false)); });
          return;
        }

        const p = document.createElement('p');
        p.className = 'unknown-spawn';
        p.textContent = 'unknown mode: ' + m;
        preview.appendChild(p);
      })();
    </script>
    <script>
      (function loadSdk() {
        if (window.versailles) return;
        var s = document.createElement('script');
        s.src = location.protocol === 'file:' ? '../.sdk/versailles.js' : '/files/.sdk/versailles.js';
        document.head.appendChild(s);
      })();
    </script>
    <script>
      (function clockWidget() {
        const t = document.getElementById('clk');
        const s = document.getElementById('clk-sec');
        const d = document.getElementById('clk-date');
        if (!t) return;
        const pad = function (n) { return String(n).padStart(2, '0'); };
        function tick() {
          const n = new Date();
          t.textContent = pad(n.getHours()) + ':' + pad(n.getMinutes());
          s.textContent = pad(n.getSeconds());
          d.textContent = n.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
        }
        tick();
        setInterval(tick, 1000);
      })();
    </script>
  </body>
</html>
