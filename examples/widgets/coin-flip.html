<!-- Paste into desktop/index.html. Unique data-id="coin-flip". Paper coin (no gold). -->
<style>
  .coin-flip { width: 260px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .coin-stage { display: flex; align-items: center; gap: 14px; }
  .coin {
    width: 62px; height: 62px; border-radius: 50%; flex: none; border: var(--stroke); background: var(--paper);
    display: grid; place-items: center; font-weight: 800; font-size: 22px; box-shadow: var(--shadow);
  }
  .coin.flip { animation: coin-flip 0.55s ease; }
  @keyframes coin-flip { 0% { transform: rotateY(0); } 100% { transform: rotateY(720deg); } }
  .coin-result { font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
  .coin-sub { font-size: 11.5px; color: var(--ink-mut); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .coin-flip .go {
    height: 36px; border-radius: var(--radius-pill); background: var(--ink); color: var(--paper);
    font: 600 11px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; border: var(--stroke);
  }
</style>
<article class="widget coin-flip" data-id="coin-flip">
  <div class="coin-stage">
    <div class="coin" id="coin">H</div>
    <div>
      <div class="coin-result" id="coin-res">Heads</div>
      <div class="coin-sub" id="coin-sub">Tap flip</div>
    </div>
  </div>
  <button class="go" id="coin-go" type="button">Flip</button>
</article>
<script>
  (function coinFlipWidget() {
    const coin = document.getElementById('coin');
    if (!coin) return;
    const res = document.getElementById('coin-res');
    const sub = document.getElementById('coin-sub');
    let heads = 0, tails = 0, busy = false;
    document.getElementById('coin-go').onclick = function () {
      if (busy) return;
      busy = true;
      coin.classList.remove('flip');
      void coin.offsetWidth;
      coin.classList.add('flip');
      setTimeout(function () {
        const h = Math.random() < 0.5;
        if (h) heads++; else tails++;
        coin.textContent = h ? 'H' : 'T';
        res.textContent = h ? 'Heads' : 'Tails';
        sub.textContent = heads + ' / ' + tails;
        busy = false;
      }, 280);
    };
  })();
</script>
