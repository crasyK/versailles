<!-- Paste template + CSS into desktop/index.html. Unique data-id="notes". data-hooks="layout". -->
<style>
  .notes-area {
    width: 100%; height: 100%; min-height: 130px; border: 0; outline: none; resize: none;
    font: inherit; font-size: 13.5px; line-height: 26px; color: var(--ink);
    background: repeating-linear-gradient(var(--paper) 0 25px, #e5e7eb 25px 26px);
    border-radius: 4px; padding: 0 2px; overflow-y: auto;
  }
</style>
<template class="spawnable" data-id="notes" data-w="320" data-h="230" data-anchor="tr" data-hooks="layout">
  <textarea class="notes-area" id="notes-area" placeholder="Jot something down…" spellcheck="false" data-no-drag></textarea>
  <script>
    (function () {
      const root = document.querySelector('.spawn-surface[data-id="notes"]');
      if (!root) return;
      const KEY = 'versailles-notes';
      const area = root.querySelector('#notes-area');
      try {
        const saved = localStorage.getItem(KEY);
        if (typeof saved === 'string') area.value = saved;
      } catch (_) {}
      let saveTimer = null;
      area.addEventListener('input', function () {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(function () {
          try { localStorage.setItem(KEY, area.value); } catch (_) {}
        }, 300);
      });
    })();
  </script>
</template>
