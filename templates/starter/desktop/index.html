<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Versailles</title>
    <script type="application/json" id="versailles">

      "autostart": true,
      "snapThreshold": 12,
      "launcher": {

    <!--
      Single-file desktop dialect
      .widget              static tile on the canvas
      .spawnable           template; host opens a native always-on-top window
      .action-bar          optional example class on a spawnable
      data-id              catalog id (calc aliases calculator)
      data-w / data-h      overlay size (a docked bar's depth)
      data-anchor          tl tc ml c mr bl bc br / cursor = overlay; tr = docked slide-out;
                           top / bottom / left / right = docked bar (top bar, taskbar, dock)
      data-offset          x,y inset from an overlay's anchor
      data-dock            docked bars: reserve (default) | float | auto-hide
      data-monitor         primary (default) | <display number> | all
      data-hotkey          global accelerator when data-hooks includes hotkey
                           (any spawnable; Alt+Space, Ctrl+Shift+D, CommandOrControl+K)
      data-hooks           allowlist: media, mouse, layout, spawn, shell, hotkey, pty, storage,
                           clipboard, power, bus, battery, network, focus, audio,
                           windows, windows-control, notify, radios, audio-control,
                           display, power-mode, wifi, bluetooth, dnd, notify-control, tray,
                           posture, keyboard, vpn, hotspot, sharing, accessibility

      A piece inside an HTML comment is not on the page: the examples near the
      end of <body> are commented out until you remove their comment markers.

      Preview: ?m=desktop (default) | widgets | spawn | spawn&id=draw | action_bar
    -->
    <style>
      :root {
        --font-sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", Roboto, sans-serif;
        --font-mono: "Cascadia Mono", "JetBrains Mono", Consolas, monospace;
        --bg: #f4f4f4;
        --canvas: #f4f4f4;
        --paper: #f9fafb;
        --ink: #141414;
        --ink-mut: #6b7280;
        --muted: #6b7280;
        --chip: #e5e7eb;
        --white: #ffffff;
        --dark-card: #131212;
        --stroke: 2px solid #141414;
        --stroke-dashed: 2px dashed #141414;
        --shadow: 0 4px 0 0 #141414;
        --radius-pill: 32px;
        --radius-card: 20px;
        --radius-chip: 9999px;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; }
      body {
        display: flex;
        flex-direction: column;
        font-family: var(--font-sans);
        color: var(--ink);
        background-color: var(--bg);
        background-image:
          linear-gradient(rgba(20, 20, 20, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(20, 20, 20, 0.045) 1px, transparent 1px);
        background-size: 28px 28px;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      html.overlay, html.overlay body {
        width: 100% !important;
        height: 100% !important;
        background: transparent;
        background-image: none;
        overflow: hidden;
      }
      html.overlay:has(.cli), html.overlay:has(.cli) body {
        background: var(--paper);
      }
      /* Transparent WebView2 + <canvas> crashes the GPU process on Windows. */
      html.overlay:has(.draw-pad), html.overlay:has(.draw-pad) body {
        background: var(--paper);
      }
      html.overlay #preview-root,
      html.overlay body.preview #preview-root {
        display: flex !important;
        flex-direction: column;
        width: 100%;
        height: 100%;
        padding: 0;
        overflow: hidden;
      }
      html.overlay .spawn-surface.solo {
        flex: 1;
        min-width: 0;
        min-height: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      html.overlay .spawn-surface.solo > .cli {
        flex: 1;
        min-height: 0;
        width: 100%;
        height: 100%;
      }
      button { font-family: inherit; border: 0; cursor: pointer; background: none; color: inherit; }

      .stage {
        position: relative;
        flex: 1;
        min-height: 0;
        padding: 26px;
        display: flex;
        align-items: flex-start;
        gap: 14px;
      }
      article.widget {
        background: var(--paper);
        border: var(--stroke);
        box-shadow: var(--shadow);
        border-radius: var(--radius-card);
        min-width: 0;
        min-height: 0;
      }

      .clock {
        width: 320px;
        height: 150px;
        padding: 16px 20px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 6px;
      }
      .clock-time {
        font: 600 52px var(--font-sans);
        letter-spacing: -0.03em;
        font-variant-numeric: tabular-nums;
        line-height: 1;
      }
      .clock-time .sec {
        display: inline-block;
        font: 600 12px var(--font-sans);
        font-variant-numeric: tabular-nums;
        color: var(--paper);
        background: var(--ink);
        border-radius: var(--radius-chip);
        padding: 3px 8px;
        margin-left: 8px;
        vertical-align: 8px;
        letter-spacing: 0;
      }
      .clock-date { font-size: 13px; color: var(--ink-mut); }

      #preview-root { display: none; flex: 1; min-height: 0; padding: 26px; gap: 16px; flex-wrap: wrap; align-content: flex-start; overflow: auto; }
      body.preview { overflow: auto; }
      body.preview #preview-root { display: flex; }
      body.preview-widgets #preview-root { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
      .spawn-surface {
        background: var(--paper); border: var(--stroke); box-shadow: var(--shadow);
        border-radius: var(--radius-card); padding: 16px; color: var(--ink);
      }
      .spawn-surface.solo { width: 100%; height: 100%; padding: 0; box-shadow: none; border: 0; background: var(--paper); }
      html.overlay .spawn-surface.solo { box-shadow: var(--shadow); border: var(--stroke); }
      html.overlay .spawn-surface.solo:has(.cli) {
        padding: 0; border: 0; box-shadow: none; background: var(--paper);
        overflow: hidden; border-radius: 18px;
      }
      .unknown-spawn {
        font: 600 12px/1.4 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase;
        color: var(--ink); border: var(--stroke-dashed); border-radius: 16px; padding: 18px;
      }

      .draw-pad { position: relative; display: flex; flex-direction: column; gap: 10px; height: 100%; min-height: 0; overflow: hidden; cursor: default; }
      .spawn-surface:not(.solo) .draw-pad { width: 560px; height: 400px; }
      .spawn-surface.solo:has(.draw-pad) {
        display: flex; flex-direction: column; padding: 8px; overflow: hidden; min-height: 0;
      }
      .draw-tools {
        display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
        flex: none; touch-action: manipulation;
      }
      .draw-group { display: inline-flex; align-items: center; gap: 6px; }
      .draw-tools .icon-btn {
        width: 32px; height: 32px; min-width: 32px; padding: 0; border-radius: 9999px;
        border: var(--stroke-dashed); background: var(--paper); color: var(--ink);
        display: grid; place-items: center; cursor: pointer; touch-action: manipulation;
      }
      .draw-tools .icon-btn:hover { background: var(--chip); }
      .draw-tools .icon-btn.on { background: #141414; color: #f9fafb; border-style: solid; }
      .draw-tools .icon-btn.danger:hover { background: #141414; color: #f9fafb; border-style: solid; }
      .draw-tools .icon-btn svg { width: 15px; height: 15px; display: block; }
      .draw-colors { display: inline-flex; gap: 6px; align-items: center; }
      .draw-colors .swatch {
        width: 18px; height: 18px; min-width: 18px; padding: 0; border-radius: 50%;
        border: 2px dashed var(--ink); background: var(--c); cursor: pointer;
      }
      .draw-colors .swatch.on { border-style: solid; }
      .draw-page {
        min-width: 28px; text-align: center;
        font: 600 10px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase;
        color: var(--ink-mut);
      }
      .draw-board-wrap {
        flex: 1; min-width: 0; min-height: 0; border: var(--stroke); border-radius: 12px;
        background: #15161a; overflow: hidden; position: relative; cursor: crosshair;
        touch-action: none; overscroll-behavior: none; user-select: none; -webkit-user-select: none;
      }
      .draw-board-wrap.is-pan { cursor: grab; }
      .draw-board-wrap svg { display: block; width: 100%; height: 100%; cursor: inherit; touch-action: none; pointer-events: none; }

      .cli {
        width: 100%; height: 100%; overflow: hidden; background: var(--paper);
        box-shadow: inset 0 0 0 2px #141414, 0 4px 0 0 #141414;
        border-radius: 18px; font-size: 13px; display: flex; flex-direction: column;
      }
      .cli-head {
        display: flex; align-items: center; gap: 10px; padding: 12px 18px 8px;
        color: var(--ink-mut); font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; flex: none;
      }
      .cli-head i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink); flex: none; }
      .cli-head .pid { margin-left: auto; }
      .cli-action { flex: 1; min-height: 0; display: flex; flex-direction: column; }
      .cli[data-mode="terminal"] .cli-action { display: none; }
      .cli-line {
        position: relative; display: flex; align-items: center; gap: 10px;
        margin: 4px 16px 8px; padding: 10px 16px; align-self: stretch;
        background: var(--white); border-radius: var(--radius-pill);
        box-shadow: inset 0 0 0 2px #141414; flex: none;
        font-family: var(--font-mono); font-size: 12.5px;
      }
      .cli-ps {
        color: var(--ink-mut); font-weight: 600; white-space: nowrap;
        overflow: hidden; text-overflow: ellipsis; max-width: 52%; flex: none;
      }
      /* The input is the visible field: native caret, selection, click-to-position, scroll. */
      .cli-typed { display: none; } /* retired mirror (#cli-echo + fake caret) */
      .cli-in {
        flex: 1; min-width: 0; width: auto; margin: 0; padding: 0;
        font: inherit; color: var(--ink); caret-color: var(--ink);
        border: 0; outline: none; background: transparent; cursor: text;
      }
      .cli-in::selection { background: var(--ink); color: var(--paper); }
      .cli-res {
        display: none; margin: 0 16px 6px; padding: 10px 16px; line-height: 1.55;
        background: var(--white); border-radius: 16px; box-shadow: inset 0 0 0 2px #141414;
        white-space: pre-wrap; word-break: break-word; flex: none; color: var(--ink); font-size: 13px;
      }
      .cli-res.on { display: block; }
      .cli-res .link { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
      .cli-sug {
        padding: 4px 12px 8px; display: flex; flex-direction: column; gap: 4px;
        flex: 1; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--chip) transparent;
      }
      .cli-sug::-webkit-scrollbar { width: 8px; }
      .cli-sug::-webkit-scrollbar-thumb { background: var(--chip); border-radius: 9999px; }
      .cl-s {
        display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
        padding: 8px 14px; border-radius: 16px; cursor: pointer; flex: none; background: var(--paper);
      }
      .cl-s b { color: var(--ink); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .cl-s span {
        color: var(--ink-mut); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        flex: none; max-width: 48%; font-size: 11.5px;
      }
      .cl-s:hover { background: var(--chip); box-shadow: inset 0 0 0 2px #141414; }
      .cl-s.on, .cl-s.on:hover { background: var(--ink); box-shadow: none; color: var(--paper); }
      .cl-s:hover b { color: var(--ink); }
      .cl-s.on b, .cl-s.on:hover b { color: var(--paper); }
      .cl-s:hover span { color: var(--ink-mut); }
      .cl-s.on span, .cl-s.on:hover span { color: var(--paper); }
      /* Section headers (Settings, Files, Recent) and app icons from bar.js. */
      .cl-g {
        flex: none; padding: 8px 14px 0; color: var(--ink-mut);
        font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
      }
      .cl-ico { width: 16px; height: 16px; margin-right: 8px; vertical-align: -3px; }
      .cli-term-wrap {
        display: none; flex: 1; min-height: 0; min-width: 0; margin: 4px 14px 10px; padding: 8px 14px 6px 12px; position: relative;
        background: var(--dark-card); border-radius: 16px; box-shadow: inset 0 0 0 2px #141414; overflow: hidden;
      }
      .cli[data-mode="terminal"] .cli-term-wrap { display: flex; flex-direction: column; }
      .cli-term-wrap[hidden] { display: none !important; }
      .cli-term { flex: 1; min-width: 0; min-height: 0; width: auto; padding: 0; overflow: hidden; background: var(--dark-card); color-scheme: dark; touch-action: pan-y; overscroll-behavior: contain; }
      .cli-term .xterm { width: 100%; height: 100%; }
      .cli-term .xterm-viewport {
        overflow-y: scroll !important; background: transparent !important;
        scrollbar-width: thin; scrollbar-color: #3f3f3f transparent;
      }
      .cli-term .xterm-viewport::-webkit-scrollbar { width: 8px; }
      .cli-term .xterm-viewport::-webkit-scrollbar-button { display: none; width: 0; height: 0; }
      .cli-term .xterm-viewport::-webkit-scrollbar-track { background: transparent; }
      .cli-term .xterm-viewport::-webkit-scrollbar-thumb { background: #3f3f3f; border-radius: 9999px; }
      .cli-term .xterm-screen { padding-right: 0; }
      .cli-term-find {
        position: absolute; top: 10px; right: 12px; z-index: 6;
        display: none; align-items: center; gap: 6px;
        padding: 6px 8px 6px 10px;
        background: var(--paper); color: var(--ink);
        border: 2px solid #141414; border-radius: 16px;
        box-shadow: 0 4px 0 0 #141414;
      }
      .cli-term-find.on { display: flex; }
      .cli-term-find input {
        width: 160px; border: 0; outline: none; background: transparent;
        font: 600 12px/1 var(--font-sans); color: var(--ink);
      }
      .cli-term-find button {
        height: 26px; min-width: 26px; padding: 0 8px;
        border: 2px dashed #141414; border-radius: 9999px;
        background: var(--paper); color: var(--ink);
        font: 600 11px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase;
        cursor: pointer;
      }
      .cli-term-find button.on,
      .cli-term-find button:active {
        background: var(--ink); color: var(--paper); border-style: solid;
      }
      .cli-term-menu {
        position: fixed; z-index: 20; display: none; flex-direction: column;
        min-width: 148px; padding: 6px;
        background: var(--paper); color: var(--ink);
        border: 2px solid #141414; border-radius: 16px;
        box-shadow: 0 4px 0 0 #141414;
      }
      .cli-term-menu.on { display: flex; }
      .cli-term-menu button {
        text-align: left; padding: 8px 12px; border: 0; background: transparent;
        color: var(--ink); border-radius: 12px; cursor: pointer;
        font: 600 11px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase;
      }
      .cli-term-menu button:hover { background: var(--chip); }
      .cli-term-menu button:disabled { opacity: 0.35; cursor: default; }
      .cli-foot {
        display: flex; gap: 14px; padding: 8px 18px 12px;
        font: 600 11px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-mut); flex: none;
      }
      .cli-foot .r { margin-left: auto; }
      body.preview-action { padding: 0; }
      body.preview-action #preview-root { padding: 0; display: block; }
      body.preview-action .spawn-surface { height: 100%; padding: 0; border: 0; box-shadow: none; background: var(--paper); }
    </style>
  </head>
  <body>
    <section id="desktop" class="stage">
      <article class="widget clock" data-id="clock">
        <div class="clock-time"><span id="clk">--:--</span><span class="sec" id="clk-sec">--</span></div>
        <div class="clock-date" id="clk-date"></div>
      </article>

      <!-- Example: a note that keeps its text with the `storage` hook
           (.versailles/storage/note.json). Delete this article and the style and
           script blocks after it to remove it. -->
      <article class="widget note" data-id="note" data-hooks="storage">
        <div class="note-label">note</div>
        <textarea class="note-text" spellcheck="false" placeholder="Write something; it stays."></textarea>
      </article>
      <style>
        .note { width: 280px; height: 150px; padding: 14px 18px; display: flex; flex-direction: column; gap: 6px; }
        .note-label { font: 600 11px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-mut); }
        .note-text { flex: 1; min-height: 0; resize: none; border: 0; outline: none; background: transparent; color: var(--ink); font: 14px/1.45 var(--font-sans); }
      </style>
      <script>
        (function noteWidget() {
          var box = document.querySelector('.note .note-text');
          if (!box) return;
          // The SDK loads after this script; wait for it.
          (function whenSdk(fn) { window.versailles && typeof window.versailles.for === 'function' ? fn(window.versailles) : setTimeout(function () { whenSdk(fn); }, 50); })(function (v) {
            var store = v.for('note').storage;
            store.get('text').then(function (text) {
              if (typeof text === 'string') box.value = text; // { host: false } in a plain browser
            }, function () {});
            var timer = 0;
            box.addEventListener('input', function () {
              clearTimeout(timer);
              timer = setTimeout(function () { store.set('text', box.value).catch(function () {}); }, 400);
            });
          });
        })();
      </script>
    </section>

    <template class="spawnable" data-id="draw" data-w="920" data-h="660" data-anchor="c" data-dismiss-on-blur="false" data-hooks="layout,spawn">
      <div class="draw-pad">
        <div class="draw-tools" data-no-drag>
          <span class="draw-group">
            <button type="button" class="icon-btn on" data-tool="pen" aria-label="Pen" title="Pen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg></button>
            <button type="button" class="icon-btn" data-tool="highlighter" aria-label="Highlight" title="Highlight"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20h16"/><path d="M9 4l8 8-4 4-8-8 4-4z"/></svg></button>
            <button type="button" class="icon-btn" data-tool="eraser" aria-label="Eraser" title="Eraser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 21h10"/><path d="M4 14l7-7 7 7-4 4H8l-4-4z"/></svg></button>
            <button type="button" class="icon-btn on" data-action="stabilize" aria-label="Smooth" title="Smooth"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 14c4-8 12-8 16 0"/></svg></button>
          </span>
          <span class="draw-colors">
            <button type="button" class="swatch on" data-color="#f9fafb" style="--c:#f9fafb" title="White"></button>
            <button type="button" class="swatch" data-color="#ffd60a" style="--c:#ffd60a" title="Yellow"></button>
            <button type="button" class="swatch" data-color="#ff6b62" style="--c:#ff6b62" title="Red"></button>
            <button type="button" class="swatch" data-color="#64d2ff" style="--c:#64d2ff" title="Blue"></button>
            <button type="button" class="swatch" data-color="#30d158" style="--c:#30d158" title="Green"></button>
          </span>
          <span class="draw-group">
            <button type="button" class="icon-btn" data-action="size-down" aria-label="Thinner" title="Thinner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
            <button type="button" class="icon-btn" data-action="size-up" aria-label="Thicker" title="Thicker"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
          </span>
          <span class="draw-group">
            <button type="button" class="icon-btn" data-action="undo" aria-label="Undo" title="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M3 13a9 9 0 1 0 3-7"/></svg></button>
            <button type="button" class="icon-btn" data-action="redo" aria-label="Redo" title="Redo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M21 13a9 9 0 1 1-3-7"/></svg></button>
          </span>
          <span class="draw-group">

      (function boot() {

        const preview = document.getElementById('preview-root');

        // that runs every template script a second time.

            return includeBar || !t.classList.contains('action-bar');

            const sid = (t.getAttribute('data-id') || '').toLowerCase();

        }

        if (m === 'spawn') {
          if (id) {
            document.documentElement.classList.add('overlay');
            const tpl = findSpawn(id);
            if (!tpl) {
              const p = document.createElement('p');
              p.className = 'unknown-spawn';
              p.textContent = 'unknown spawnable: ' + id;
              preview.appendChild(p);
              return;
            }
            const hosted = !!(window.__TAURI_INTERNALS__ || window.__TAURI__);
            if (!hosted) {
              const w = tpl.getAttribute('data-w');
              const h = tpl.getAttribute('data-h');
              if (w) document.body.style.width = w + 'px';
              if (h) document.body.style.height = h + 'px';
            }
            preview.style.padding = '0';
            mountSpawn(tpl, true, preview);
            return;
          }
          spawnables(false).forEach(function (t) { mountSpawn(t, false, preview); });
          return;
        }

        const p = document.createElement('p');
        p.className = 'unknown-spawn';
        p.textContent = 'unknown mode: ' + m;
        preview.appendChild(p);
      })();
    </script>
    <script>
      (function loadSdk() {
        if (window.versailles && typeof window.versailles.invoke === 'function') return;
        var s = document.createElement('script');
        s.src = location.protocol === 'file:' ? '../.sdk/versailles.js' : '/files/.sdk/versailles.js';
        document.head.appendChild(s);
      })();
    </script>
    <script>
      (function clockWidget() {
        const t = document.getElementById('clk');
        const s = document.getElementById('clk-sec');
        const d = document.getElementById('clk-date');
        if (!t) return;
        const pad = function (n) { return String(n).padStart(2, '0'); };
        // Writing the same text still repaints: write only what changed.
        const put = function (el, text) { if (el.textContent !== text) el.textContent = text; };
        function tick() {
          const n = new Date();
          put(t, pad(n.getHours()) + ':' + pad(n.getMinutes()));
          put(s, pad(n.getSeconds()));
          put(d, n.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' }));
        }
        tick();
        setInterval(tick, 1000);
      })();
    </script>
  </body>
</html>
