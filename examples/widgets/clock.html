<!-- Paste into desktop/index.html. Unique data-id="clock". Digital + seconds pill. -->
<style>
  .clock { width: 320px; height: 150px; padding: 16px 20px; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
  .clock-time { font: 600 52px var(--font-sans); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1; }
  .clock-time .sec {
    display: inline-block; font: 600 12px var(--font-sans); font-variant-numeric: tabular-nums;
    color: var(--paper); background: var(--ink); border-radius: var(--radius-chip);
    padding: 3px 8px; margin-left: 8px; vertical-align: 8px; letter-spacing: 0;
  }
  .clock-date { font-size: 13px; color: var(--ink-mut); }
</style>
<article class="widget clock" data-id="clock">
  <div class="clock-time"><span id="clk">--:--</span><span class="sec" id="clk-sec">--</span></div>
  <div class="clock-date" id="clk-date"></div>
</article>
<script>
  (function clockWidget() {
    const t = document.getElementById('clk');
    const s = document.getElementById('clk-sec');
    const d = document.getElementById('clk-date');
    if (!t) return;
    const pad = function (n) { return String(n).padStart(2, '0'); };
    function tick() {
      const n = new Date();
      t.textContent = pad(n.getHours()) + ':' + pad(n.getMinutes());
      s.textContent = pad(n.getSeconds());
      d.textContent = n.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
    }
    tick();
    setInterval(tick, 1000);
  })();
</script>
